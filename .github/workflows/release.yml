name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
  # Automatic releases are now handled by version-release.yml, which
  # auto-tags from package.json on every push to main and builds +
  # publishes the GitHub Release itself. This workflow is kept only
  # as a manual fallback (Actions tab -> Release -> Run workflow) so
  # the two pipelines never race to create the same tag/release.

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # electron-builder --publish always will:
    #   1. Build the installer (.exe / .dmg / .tar.gz)
    #   2. Generate latest.yml / latest-mac.yml / latest-linux.yml
    #   3. Upload EVERYTHING to the GitHub Release in one step
    # This is required for electron-updater to work in packaged apps.

    - name: Build and publish (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: npx electron-builder --linux --publish always
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish (Windows)
      if: matrix.os == 'windows-latest'
      run: npx electron-builder --win --publish always
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish (macOS)
      if: matrix.os == 'macos-latest'
      run: npx electron-builder --mac --publish always
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_IDENTITY_AUTO_DISCOVERY: false
        SKIP_CODE_SIGN: true
