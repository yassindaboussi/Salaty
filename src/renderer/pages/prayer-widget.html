<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Widget</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/prayer-widget.css">
</head>
<body>
  <div id="app" class="theme-navy">

    <!-- Icône logo (zone draggable) -->
    <i class="fas fa-mosque tb-logo"></i>

    <div class="tb-div"></div>

    <!-- 5 colonnes de prière -->
    <div class="tb-prayers" id="prayerList">
      <div class="tb-spin"><i class="fas fa-spinner fa-spin"></i></div>
    </div>

    <div class="tb-div"></div>

    <!-- Compte à rebours -->
    <span class="tb-timer" id="timerDisplay">--:--</span>

    <!-- Contrôles -->
    <div class="tb-controls">
      <button class="tb-btn pinned" id="pinBtn" title="Toujours visible"><i class="fas fa-thumbtack"></i></button>
      <button class="tb-btn tb-btn--close" id="closeBtn" title="Fermer"><i class="fas fa-times"></i></button>
    </div>

  </div>
  <script src="../js/prayer-widget.js"></script>
</body>
</html>
