<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server18.mp3quran.net https://cdn.mp3quran.net; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer Widget</title>
    <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../css/05-widgets/widget-base.css" />
    <link rel="stylesheet" href="../../css/00-settings/tokens.css" />
    <link rel="stylesheet" href="../../css/05-widgets/prayer-widget.css" />
  </head>
  <body>
    <div id="app" class="theme-navy">
      <!-- Countdown to the next prayer (the white column says which one) -->
      <div class="pw-next" id="nextBlock" role="timer" aria-live="off">
        <span class="pw-next-count" id="timerDisplay">-:--:--</span>
      </div>

      <div class="pw-div" aria-hidden="true"></div>

      <!-- The day's five prayers, in time order -->
      <ol class="pw-prayers" id="prayerList">
        <li class="pw-spin">
          <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
        </li>
      </ol>

      <div class="pw-div" aria-hidden="true"></div>

      <div class="pw-controls">
        <button
          type="button"
          class="pw-btn is-pinned"
          id="pinBtn"
          aria-pressed="true"
          data-tooltip="tooltipPin"
        >
          <i class="fas fa-thumbtack" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="pw-btn pw-btn--close"
          id="closeBtn"
          data-tooltip="tooltipClose"
        >
          <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="pw-tip" id="widgetTip" aria-hidden="true"></div>
    <script src="../../js-bundled/prayer-widget.bundle.js"></script>
  </body>
</html>
