<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer Widget</title>
    <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../css/05-widgets/widget-base.css" />
    <link rel="stylesheet" href="../../css/05-widgets/prayer-widget.css" />
  </head>
  <body>
    <div id="app" class="theme-navy">
      <!-- Logo (drag handle) -->
      <i class="fas fa-mosque tb-logo" aria-hidden="true"></i>

      <div class="tb-div"></div>

      <!-- Five prayer columns -->
      <div class="tb-prayers" id="prayerList">
        <div class="tb-spin">
          <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
        </div>
      </div>

      <div class="tb-div"></div>

      <!-- Countdown -->
      <span class="tb-timer" id="timerDisplay">--:--</span>

      <!-- Controls -->
      <div class="tb-controls">
        <button
          type="button"
          class="tb-btn pinned"
          id="pinBtn"
          data-tooltip="tooltipPin"
        >
          <i class="fas fa-thumbtack" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="tb-btn tb-btn--close"
          id="closeBtn"
          data-tooltip="tooltipClose"
        >
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <script src="../../js-bundled/prayer-widget.bundle.js"></script>
  </body>
</html>
