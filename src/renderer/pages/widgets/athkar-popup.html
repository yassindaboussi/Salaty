<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athkar</title>
    <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../css/05-widgets/widget-base.css" />
    <link rel="stylesheet" href="../../css/05-widgets/athkar-popup.css" />
  </head>
  <body>
    <div id="app" class="theme-navy">
      <div class="popup-card">
        <div class="popup-header">
          <div class="popup-icon">
            <i class="fas fa-moon" aria-hidden="true"></i>
          </div>
          <span class="popup-title" id="popupTitle">Salaty Time · أذكار</span>
          <button
            type="button"
            class="popup-close-btn"
            id="closeBtn"
            title="Fermer"
            data-tooltip="tooltipClose"
          >
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <div class="popup-divider"></div>

        <div class="popup-body">
          <p class="popup-athkar-text" id="athkarText">…</p>
        </div>

        <!-- Shown only for adhan popups -->
        <button type="button" class="popup-open-app-btn hidden" id="openAppBtn">
          <i class="fas fa-hand-paper" aria-hidden="true"></i>
          <span id="openAppLabel">Open the app</span>
        </button>

        <div class="popup-progress">
          <div class="popup-progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <script src="../../js-bundled/athkar-popup.bundle.js"></script>
  </body>
</html>
