<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salaty Time - Islamic Prayer Times</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/home.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
    <link rel="stylesheet" href="../../css/03-components/custom-dialog.css" />
    <link rel="stylesheet" href="../../css/03-components/offline-banner.css" />
    <link
      rel="stylesheet"
      href="../../css/03-components/api-health-indicator.css"
    />
  </head>
  <body class="page-loading">
    <div class="app-container theme-dark" id="app">
      <div class="drag-area"></div>

      <div class="header">
        <div class="window-controls">
          <button
            class="settings-btn"
            id="mainSettingsBtn"
            aria-label="Settings"
            data-tooltip="tooltipSettings"
          >
            <i class="fas fa-cog"></i>
          </button>
          <button
            class="features-btn"
            id="mainFeaturesBtn"
            aria-label="Features"
            data-tooltip="tooltipFeatures"
          >
            <i class="fas fa-th-large"></i>
          </button>
          <button
            class="widget-toggle-btn"
            id="prayerWidgetBtn"
            aria-label="Prayer Widget"
            data-tooltip="tooltipWidget"
          >
            <i class="fas fa-clock"></i>
          </button>

          <div class="draggable-header-space"></div>

          <div class="right-controls">
            <button
              class="control-btn minimize-btn"
              id="minimizeBtn"
              aria-label="Minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button
              class="control-btn fullscreen-btn"
              id="fullscreenBtn"
              aria-label="Toggle Fullscreen"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand"></i>
            </button>
            <button
              class="control-btn close-btn"
              id="closeBtn"
              aria-label="Close"
              data-tooltip="tooltipClose"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="location-wrapper">
          <div class="location" id="location">Loading...</div>
          <button
            class="location-switcher-btn"
            id="locationSwitcherBtn"
            aria-label="Switch Location"
            style="display: none"
          >
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="location-switcher-dropdown" id="locationSwitcherDropdown">
            <!-- Locations will be dynamically inserted here -->
          </div>
        </div>
        <div class="date-container">
          <span class="date-info" id="gregorianDate"></span>
          <span class="date-separator"> | </span>
          <span class="hijri-date" id="hijriDate"></span>
        </div>
        <div class="ramadan-countdown" id="ramadanCountdown"></div>
      </div>

      <!-- Events Banner -->
      <div class="events-banner" id="eventsBanner" style="display: none">
        <div class="events-banner-content">
          <i class="fas fa-bullhorn events-icon"></i>
          <span id="eventText"
            >Bienvenue sur Salaty ! Restez à l'écoute pour les événements à
            venir.</span
          >
        </div>
        <button
          class="events-close-btn"
          id="closeEventBanner"
          aria-label="Fermer"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="prayer-cards-container" id="prayerCards">
        <div class="loading" id="loadingText">Loading prayer times...</div>
      </div>

      <div class="prayer-times" id="prayerTimes">
        <div id="prayerList"></div>
      </div>

      <!-- Update Modal -->
      <div id="updateModal" class="modal">
        <div class="modal-content">
          <h3 id="updateTitle">Mise à jour disponible</h3>
          <p id="updateMessage">Une nouvelle version est disponible.</p>
          <div class="modal-buttons">
            <button id="updateActionBtn" class="modal-btn primary">
              Télécharger
            </button>
            <button id="updateCancelBtn" class="modal-btn secondary">
              Plus tard
            </button>
          </div>
          <div id="updateProgress" class="update-progress hidden">
            <div class="progress-bar">
              <div class="progress-fill" id="updateProgressBar"></div>
            </div>
            <span id="updateProgressText">0%</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../../js/ui/offline-banner.js"></script>
    <script src="../../js/core/renderer.js"></script>
  </body>
</html>
