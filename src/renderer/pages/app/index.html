<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server18.mp3quran.net https://cdn.mp3quran.net; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salaty Time - Islamic Prayer Times</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/home.css" />
    <link rel="stylesheet" href="../../css/03-components/custom-dialog.css" />
    <link rel="stylesheet" href="../../css/03-components/feedback-dialog.css" />
    <link rel="stylesheet" href="../../css/03-components/update-dialog.css" />
    <link rel="stylesheet" href="../../css/03-components/offline-banner.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <header class="header">
        <div class="window-controls">
          <button
            type="button"
            class="settings-btn"
            id="mainSettingsBtn"
            data-tooltip="tooltipSettings"
          >
            <i class="fas fa-cog" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            class="features-btn"
            id="mainFeaturesBtn"
            data-tooltip="tooltipFeatures"
          >
            <i class="fas fa-th-large" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            class="widget-toggle-btn"
            id="prayerWidgetBtn"
            data-tooltip="tooltipWidget"
            aria-pressed="false"
          >
            <i class="fas fa-clock" aria-hidden="true"></i>
          </button>

          <div class="draggable-header-space"></div>

          <div class="right-controls">
            <button
              type="button"
              class="control-btn minimize-btn"
              id="minimizeBtn"
              data-window-action="minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button
              type="button"
              class="control-btn"
              id="fullscreenBtn"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="control-btn close-btn"
              id="closeBtn"
              data-window-action="close"
              data-tooltip="tooltipClose"
            >
              <svg
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="location-wrapper">
          <div class="location" id="location">Loading...</div>
          <button
            type="button"
            class="location-switcher-btn"
            id="locationSwitcherBtn"
            aria-label="Switch location"
            data-i18n-aria-label="switchLocationLabel"
            style="display: none"
          >
            <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <div class="location-switcher-dropdown" id="locationSwitcherDropdown">
            <!-- Locations will be dynamically inserted here -->
          </div>
        </div>
        <div class="date-container">
          <span class="date-info" id="gregorianDate"></span>
          <span class="date-separator"> | </span>
          <span class="hijri-date" id="hijriDate"></span>
        </div>
        <div class="ramadan-countdown" id="ramadanCountdown"></div>
      </header>

      <!-- Events Banner -->
      <div class="events-banner" id="eventsBanner" style="display: none">
        <div class="events-banner-content">
          <i class="fas fa-bullhorn events-icon" aria-hidden="true"></i>
          <span class="events-text" id="eventText"></span>
        </div>
        <button
          type="button"
          class="events-close-btn"
          id="closeEventBanner"
          aria-label="Close"
          data-i18n-aria-label="close"
        >
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>

      <div class="prayer-cards-container" id="prayerCards">
        <div class="loading" id="loadingText" data-i18n="loadingPrayerTimes">
          Loading prayer times...
        </div>
      </div>

      <div class="prayer-times" id="prayerTimes">
        <div class="prayer-list" id="prayerList"></div>
      </div>

      <!-- A new version: available, downloading, ready, failed (components/update-dialog.js) -->
      <dialog
        class="update-dialog"
        id="updateDialog"
        aria-labelledby="updateTitle"
        aria-describedby="updateText"
      >
        <div class="update-body">
          <button
            type="button"
            class="update-close"
            id="updateClose"
            data-i18n-aria-label="updClose"
          >
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
          <div class="update-head">
            <span class="update-icon" aria-hidden="true">
              <i class="fas fa-circle-arrow-down" id="updateIcon"></i>
            </span>
            <h2 class="update-title" id="updateTitle">Update available</h2>
          </div>
          <p class="update-text" id="updateText"></p>
          <a
            class="update-link"
            id="updateWhatsNew"
            href="https://github.com/yassindaboussi/Salaty/releases/latest"
            target="_blank"
            rel="noopener"
            ><span data-i18n="updWhatsNew">What's new</span
            ><i class="fas fa-arrow-right" aria-hidden="true"></i
          ></a>
          <div class="update-progress" id="updateProgress" hidden>
            <div
              class="update-bar"
              id="updateBar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-labelledby="updateTitle"
            >
              <div class="update-bar-fill" id="updateBarFill"></div>
            </div>
            <span
              class="update-progress-text"
              id="updateProgressText"
              aria-live="polite"
              >0%</span
            >
          </div>
          <p
            class="update-note"
            id="updateLaterNote"
            data-i18n="updLaterNote"
            hidden
          >
            If you choose Later, it installs when you quit Salaty Time.
            Otherwise we will remind you the next time you open it.
          </p>
          <div class="update-actions">
            <button type="button" class="update-btn" id="updateSecondary">
              Later
            </button>
            <button
              type="button"
              class="update-btn update-btn--primary"
              id="updatePrimary"
            >
              Download
            </button>
          </div>
        </div>
      </dialog>
    </div>

    <script src="../../js-bundled/home.bundle.js"></script>
  </body>
</html>
