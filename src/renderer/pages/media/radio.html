<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="muslimRadio">Muslim Radio - Salaty Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/radio.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="radio-container">
        <!-- HEADER -->
        <header
          class="page-header radio-header"
          data-page-header
          data-controls-class="radio-controls"
        >
          <h1 class="page-header__title" id="radioTitle"></h1>
        </header>

        <!-- MAIN CONTENT -->
        <main class="radio-content">
          <!-- NOW PLAYING — VINYL DISC -->
          <div class="now-playing-section">
            <!-- Vinyl disc with tonearm -->
            <div class="vinyl-wrapper">
              <!-- Tonearm -->
              <div class="tonearm idle" id="tonearm">
                <svg
                  viewBox="0 0 60 60"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <!-- Pivot base -->
                  <circle
                    cx="8"
                    cy="8"
                    r="5"
                    fill="rgba(255,255,255,0.15)"
                    stroke="rgba(255,255,255,0.3)"
                    stroke-width="1"
                  />
                  <circle cx="8" cy="8" r="2" fill="rgba(255,170,0,0.8)" />
                  <!-- Arm body -->
                  <line
                    x1="8"
                    y1="8"
                    x2="42"
                    y2="50"
                    stroke="rgba(255,255,255,0.25)"
                    stroke-width="2.5"
                    stroke-linecap="round"
                  />
                  <!-- Cartridge head -->
                  <rect
                    x="38"
                    y="46"
                    width="8"
                    height="5"
                    rx="2"
                    fill="rgba(255,170,0,0.6)"
                    stroke="rgba(255,170,0,0.8)"
                    stroke-width="0.8"
                  />
                  <!-- Needle tip -->
                  <line
                    x1="43"
                    y1="51"
                    x2="44"
                    y2="55"
                    stroke="rgba(255,255,255,0.6)"
                    stroke-width="1"
                    stroke-linecap="round"
                  />
                </svg>
              </div>

              <!-- Disc -->
              <div class="vinyl-disc" id="vinylDisc">
                <div class="vinyl-disc-inner">
                  <!-- Center label / art -->
                  <div class="vinyl-center">
                    <div class="vinyl-center-default" id="vinylDefault">
                      <i class="fas fa-broadcast-tower" aria-hidden="true"></i>
                    </div>
                    <img
                      src=""
                      alt=""
                      id="stationImage"
                      class="vinyl-station-image"
                      style="display: none"
                    />
                  </div>
                </div>
              </div>
            </div>
            <!-- /vinyl-wrapper -->

            <!-- Station info text -->
            <div class="now-playing-info">
              <div class="now-playing-label" id="nowPlayingBadge"></div>
              <div class="station-name" id="stationName"></div>
              <div class="station-description" id="stationDescription"></div>
              <!-- Animated sound bars (visible when playing) -->
              <div class="sound-bars" id="playingAnimation">
                <span></span><span></span><span></span><span></span
                ><span></span>
              </div>
            </div>
          </div>
          <!-- /now-playing-section -->

          <!-- PLAYER CONTROLS — always visible, minimal -->
          <div class="player-controls">
            <!-- Stop -->
            <button
              type="button"
              class="player-btn"
              id="stopBtn"
              data-tooltip="tooltipStop"
            >
              <i class="fas fa-stop" aria-hidden="true"></i>
            </button>

            <!-- Play / Pause — primary -->
            <button
              type="button"
              class="player-btn play-pause-btn"
              id="playPauseBtn"
              data-tooltip="tooltipPlayPause"
            >
              <i class="fas fa-play" id="playPauseIcon" aria-hidden="true"></i>
            </button>

            <!-- Volume -->
            <div class="volume-control">
              <button
                type="button"
                class="player-btn"
                id="muteBtn"
                data-tooltip="tooltipMute"
              >
                <i
                  class="fas fa-volume-up"
                  id="volumeIcon"
                  aria-hidden="true"
                ></i>
              </button>
              <input
                type="range"
                class="volume-slider"
                id="volumeSlider"
                data-i18n-aria-label="volume"
                min="0"
                max="100"
                value="80"
              />
            </div>
          </div>

          <!-- DIVIDER -->
          <div class="stations-divider">
            <div class="stations-divider-line"></div>
            <span class="stations-divider-label" id="stationsLabel"></span>
            <div class="stations-divider-line"></div>
          </div>

          <!-- STATIONS LIST -->
          <div class="stations-section">
            <div class="stations-grid" id="stationsGrid">
              <!-- Dynamically loaded -->
            </div>
          </div>

          <!-- LOADING -->
          <div class="radio-loading" id="radioLoading" style="display: none">
            <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
            <span id="loadingText"></span>
          </div>
        </main>
        <!-- /radio-content -->

        <!-- FOOTER -->
        <footer class="radio-footer">
          <div class="radio-footer-text" id="radioFooterText"></div>
        </footer>
      </div>
      <!-- /radio-container -->
    </div>

    <script src="../../js-bundled/radio.bundle.js"></script>
  </body>
</html>
