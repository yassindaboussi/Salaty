<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="muslimRadio">Muslim Radio - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/radio.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="radio-container">
        <header
          class="page-header radio-header"
          data-page-header
          data-controls-class="radio-controls"
          data-back="features"
        >
          <h1 class="page-header__title" data-i18n="muslimRadio">
            Muslim Radio
          </h1>
        </header>

        <main class="rd-layout" id="rdLayout">
          <!-- The stations: tabs, search, list -->
          <section class="rd-main">
            <div class="rd-toolbar">
              <div
                class="rd-tabs"
                role="tablist"
                data-i18n-aria-label="muslimRadio"
              >
                <button
                  type="button"
                  class="rd-tab"
                  id="rdTabStations"
                  role="tab"
                  data-tab="stations"
                  aria-controls="rdList"
                  aria-selected="true"
                >
                  <i class="fas fa-tower-broadcast" aria-hidden="true"></i>
                  <span data-i18n="rdStations">Stations</span>
                </button>
                <button
                  type="button"
                  class="rd-tab"
                  id="rdTabReciters"
                  role="tab"
                  data-tab="reciters"
                  aria-controls="rdList"
                  aria-selected="false"
                  tabindex="-1"
                >
                  <i class="fas fa-microphone-lines" aria-hidden="true"></i>
                  <span data-i18n="rdReciters">Reciters</span>
                </button>
              </div>
              <div class="rd-search" role="search">
                <i
                  class="fas fa-magnifying-glass rd-search-icon"
                  aria-hidden="true"
                ></i>
                <input
                  type="search"
                  class="rd-search-input"
                  id="rdSearch"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-placeholder="rdSearch"
                  data-i18n-aria-label="rdSearch"
                  placeholder="Search a radio..."
                />
              </div>
            </div>

            <div class="rd-list" id="rdList" role="tabpanel"></div>
          </section>

          <!-- What is playing and the controls -->
          <aside class="rd-panel">
            <div class="rd-panel-head">
              <h2 class="rd-panel-heading" data-i18n="nowPlaying">
                Now Playing
              </h2>
              <button
                type="button"
                class="rd-panel-toggle"
                id="rdPanelToggle"
                aria-controls="rdPanelBody"
                aria-expanded="true"
                data-tooltip="rdPanelHide"
              >
                <i class="fas fa-angles-right" aria-hidden="true"></i>
              </button>
            </div>

            <!-- folded: a strip of icons -->
            <div class="rd-rail" id="rdRail">
              <button
                type="button"
                class="rd-panel-toggle"
                id="rdRailPlay"
                data-rail="play"
                data-tooltip="tooltipPlayPause"
              >
                <i class="fas fa-play" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="rd-panel-toggle"
                data-rail="stop"
                data-tooltip="tooltipStop"
              >
                <i class="fas fa-stop" aria-hidden="true"></i>
              </button>
            </div>

            <div class="rd-panel-body" id="rdPanelBody">
              <div class="rd-art" id="rdArt"></div>
              <div class="rd-now">
                <p class="rd-now-name" id="rdNowName" dir="auto">—</p>
                <p class="rd-now-sub" id="rdNowSub" role="status"></p>
              </div>

              <div class="rd-controls">
                <button
                  type="button"
                  class="rd-btn"
                  id="rdStop"
                  data-tooltip="tooltipStop"
                >
                  <i class="fas fa-stop" aria-hidden="true"></i>
                </button>
                <button
                  type="button"
                  class="rd-btn rd-btn-main"
                  id="rdPlay"
                  data-tooltip="tooltipPlayPause"
                >
                  <i class="fas fa-play" aria-hidden="true"></i>
                </button>
                <button
                  type="button"
                  class="rd-btn"
                  id="rdFav"
                  aria-pressed="false"
                  data-tooltip="rdAddFavourite"
                >
                  <i class="far fa-star" aria-hidden="true"></i>
                </button>
              </div>

              <div class="rd-volume">
                <button
                  type="button"
                  class="rd-icon-btn"
                  id="rdMute"
                  data-tooltip="tooltipMute"
                >
                  <i class="fas fa-volume-high" aria-hidden="true"></i>
                </button>
                <input
                  type="range"
                  class="rd-range"
                  id="rdVolume"
                  min="0"
                  max="100"
                  value="100"
                  data-i18n-aria-label="volume"
                  aria-label="Volume"
                />
              </div>

              <p class="rd-note" data-i18n="rdKeepsPlaying">
                The radio keeps playing when you leave this page.
              </p>
            </div>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/radio.bundle.js"></script>
  </body>
</html>
