<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="livestreamsTitle">Live Streams - Salaty Time</title>

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/livestreams.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="livestreams-container">
        <!-- ── HEADER ── -->
        <header
          class="page-header livestreams-header"
          data-page-header
          data-controls-class="livestreams-controls"
        >
          <h1
            class="page-header__title"
            id="livestreamsTitle"
            data-i18n="livestreamsTitle"
          >
            Live Haramain Streams
          </h1>
        </header>

        <!-- ── CHANNEL SELECTOR TABS ── -->
        <div class="channel-tabs" role="tablist">
          <button
            type="button"
            class="channel-tab active"
            id="tabMakkah"
            role="tab"
            aria-selected="true"
            aria-controls="panelMakkah"
          >
            <span class="channel-tab-icon"
              ><i class="fas fa-kaaba" aria-hidden="true"></i
            ></span>
            <span id="tabMakkahLabel" data-i18n="makkahTab">Makkah</span>
          </button>
          <button
            type="button"
            class="channel-tab"
            id="tabMadina"
            role="tab"
            aria-selected="false"
            aria-controls="panelMadina"
          >
            <span class="channel-tab-icon"
              ><i class="fas fa-mosque" aria-hidden="true"></i
            ></span>
            <span id="tabMadinaLabel" data-i18n="madinaTab">Madina</span>
          </button>
        </div>

        <!-- ── CONTENT PANELS ── -->
        <main class="livestreams-content">
          <!-- Makkah Panel -->
          <div
            class="stream-panel active"
            id="panelMakkah"
            role="tabpanel"
            aria-labelledby="tabMakkah"
          >
            <!-- Info bar -->
            <div class="stream-info-bar">
              <div class="stream-location">
                <div class="stream-location-icon">
                  <i class="fas fa-kaaba" aria-hidden="true"></i>
                </div>
                <div class="stream-location-text">
                  <span
                    class="stream-location-name"
                    id="makkahTitle"
                    data-i18n="makkahLive"
                    >Al Masjid al-Haram</span
                  >
                  <span class="stream-location-sub" data-i18n="makkahLocation"
                    >Makkah al-Mukarramah</span
                  >
                </div>
              </div>
              <div class="live-badge">
                <span class="live-dot"></span>
                <span class="live-text" data-i18n="live">Live</span>
              </div>
            </div>

            <!-- Video -->
            <div class="video-container">
              <iframe
                id="iframe-makkah"
                class="responsive-iframe"
                src="about:blank"
                title="Makkah Live"
                data-i18n-title="makkahLive"
                frameborder="0"
                allow="
                  autoplay;
                  encrypted-media;
                  picture-in-picture;
                  fullscreen;
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"
              ></iframe>
            </div>
          </div>

          <!-- Madina Panel -->
          <div
            class="stream-panel"
            id="panelMadina"
            role="tabpanel"
            aria-labelledby="tabMadina"
          >
            <!-- Info bar -->
            <div class="stream-info-bar">
              <div class="stream-location">
                <div class="stream-location-icon">
                  <i class="fas fa-mosque" aria-hidden="true"></i>
                </div>
                <div class="stream-location-text">
                  <span
                    class="stream-location-name"
                    id="madinaTitle"
                    data-i18n="madinaLive"
                    >Al Masjid an-Nabawi</span
                  >
                  <span class="stream-location-sub" data-i18n="madinaLocation"
                    >Al-Madinah al-Munawwarah</span
                  >
                </div>
              </div>
              <div class="live-badge">
                <span class="live-dot"></span>
                <span class="live-text" data-i18n="live">Live</span>
              </div>
            </div>

            <!-- Video -->
            <div class="video-container">
              <iframe
                id="iframe-madina"
                class="responsive-iframe"
                src="about:blank"
                title="Madina Live"
                data-i18n-title="madinaLive"
                frameborder="0"
                allow="
                  autoplay;
                  encrypted-media;
                  picture-in-picture;
                  fullscreen;
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"
              ></iframe>
            </div>
          </div>
        </main>
        <!-- end .livestreams-content -->
      </div>
    </div>

    <script src="../../js-bundled/livestreams.bundle.js"></script>
  </body>
</html>
