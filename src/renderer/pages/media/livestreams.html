<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Streams - Salaty Time</title>

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/livestreams.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-dark" id="app">
      <div class="drag-area"></div>

      <div class="livestreams-container">
        <!-- ── HEADER (preserved exactly) ── -->
        <div class="livestreams-header">
          <button
            class="back-btn"
            id="backBtn"
            aria-label="Back to Features"
            data-tooltip="tooltipBack"
          >
            <i class="fas fa-arrow-left"></i>
          </button>
          <h2 class="livestreams-title" id="livestreamsTitle">
            Live Haramain Streams
          </h2>
          <div class="livestreams-controls">
            <button
              class="control-btn minimize-btn"
              id="minimizeBtn"
              aria-label="Minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button
              class="control-btn fullscreen-btn"
              id="fullscreenBtn"
              aria-label="Toggle Fullscreen"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand"></i>
            </button>
            <button
              class="control-btn close-btn"
              id="closeBtn"
              aria-label="Close"
              data-tooltip="tooltipClose"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- ── CHANNEL SELECTOR TABS ── -->
        <div class="channel-tabs" role="tablist">
          <button
            class="channel-tab active"
            id="tabMakkah"
            role="tab"
            aria-selected="true"
            aria-controls="panelMakkah"
          >
            <span class="channel-tab-icon"><i class="fas fa-kaaba"></i></span>
            <span id="tabMakkahLabel">Makkah</span>
          </button>
          <button
            class="channel-tab"
            id="tabMadina"
            role="tab"
            aria-selected="false"
            aria-controls="panelMadina"
          >
            <span class="channel-tab-icon"><i class="fas fa-mosque"></i></span>
            <span id="tabMadinaLabel">Madina</span>
          </button>
        </div>

        <!-- ── CONTENT PANELS ── -->
        <div class="livestreams-content" id="livestreamsContent">
          <!-- Makkah Panel -->
          <div
            class="stream-panel active"
            id="panelMakkah"
            role="tabpanel"
            aria-labelledby="tabMakkah"
          >
            <!-- Info bar -->
            <div class="stream-info-bar">
              <div class="stream-location">
                <div class="stream-location-icon">
                  <i class="fas fa-kaaba"></i>
                </div>
                <div class="stream-location-text">
                  <span class="stream-location-name" id="makkahTitle"
                    >Al Masjid al-Haram</span
                  >
                  <span class="stream-location-sub">Makkah al-Mukarramah</span>
                </div>
              </div>
              <div class="live-badge">
                <span class="live-dot"></span>
                <span class="live-text">Live</span>
              </div>
            </div>

            <!-- Video -->
            <div class="video-container">
              <iframe
                id="iframe-makkah"
                class="responsive-iframe"
                src="about:blank"
                title="Makkah Live"
                frameborder="0"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                  fullscreen;
                  display-capture;
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-presentation"
              ></iframe>
            </div>
          </div>

          <!-- Madina Panel -->
          <div
            class="stream-panel"
            id="panelMadina"
            role="tabpanel"
            aria-labelledby="tabMadina"
          >
            <!-- Info bar -->
            <div class="stream-info-bar">
              <div class="stream-location">
                <div class="stream-location-icon">
                  <i class="fas fa-mosque"></i>
                </div>
                <div class="stream-location-text">
                  <span class="stream-location-name" id="madinaTitle"
                    >Al Masjid an-Nabawi</span
                  >
                  <span class="stream-location-sub"
                    >Al-Madinah al-Munawwarah</span
                  >
                </div>
              </div>
              <div class="live-badge">
                <span class="live-dot"></span>
                <span class="live-text">Live</span>
              </div>
            </div>

            <!-- Video -->
            <div class="video-container">
              <iframe
                id="iframe-madina"
                class="responsive-iframe"
                src="about:blank"
                title="Madina Live"
                frameborder="0"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                  fullscreen;
                  display-capture;
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-presentation"
              ></iframe>
            </div>
          </div>
        </div>
        <!-- end .livestreams-content -->
      </div>
    </div>

    <script src="../../js/core/renderer.js"></script>
  </body>
</html>
