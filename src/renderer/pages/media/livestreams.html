<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="livestreamsTitle">Live Streams - Salaty Time</title>

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/livestreams.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="livestreams-container">
        <header
          class="page-header livestreams-header"
          data-page-header
          data-controls-class="livestreams-controls"
          data-back="features"
        >
          <h1 class="page-header__title" data-i18n="livestreamsTitle">
            Live Haramain Streams
          </h1>
        </header>

        <main class="lv-layout" id="lvLayout">
          <!-- The live video -->
          <section class="lv-main">
            <div class="lv-video" id="lvVideo">
              <iframe
                id="lvFrame"
                class="lv-frame"
                src="about:blank"
                data-i18n-title="livestreamsTitle"
                title="Live"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                sandbox="allow-scripts allow-same-origin allow-presentation"
                hidden
              ></iframe>
              <div class="lv-message" id="lvMessage" role="status">
                <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
                <span id="lvMessageText"
                  >Connecting to the live broadcast…</span
                >
                <button type="button" class="lv-btn-text" id="lvRetry" hidden>
                  <span data-i18n="lvRetry">Try again</span>
                </button>
              </div>
            </div>
          </section>

          <!-- The two mosques, the time in Makkah -->
          <aside class="lv-panel">
            <div class="lv-panel-head">
              <h2 class="lv-panel-heading" data-i18n="lvChannels">Live from</h2>
              <button
                type="button"
                class="lv-panel-toggle"
                id="lvPanelToggle"
                aria-controls="lvPanelBody"
                aria-expanded="true"
                data-tooltip="lvPanelHide"
              >
                <i class="fas fa-angles-right" aria-hidden="true"></i>
              </button>
            </div>

            <!-- folded: one icon per mosque -->
            <div class="lv-rail" id="lvRail"></div>

            <div class="lv-panel-body" id="lvPanelBody">
              <div class="lv-channels" id="lvChannels"></div>

              <div class="lv-box">
                <p class="lv-box-title" data-i18n="lvMakkahTime">
                  Time in Makkah
                </p>
                <p class="lv-clock" id="lvClock">--:--</p>
                <p class="lv-date" id="lvDate"></p>
              </div>

              <button
                type="button"
                class="lv-btn-text lv-youtube"
                id="lvYoutube"
              >
                <i class="fab fa-youtube" aria-hidden="true"></i>
                <span data-i18n="lvOpenYoutube">Open on YouTube</span>
              </button>
              <p class="lv-note" data-i18n="lvSource">
                Official broadcast of the Saudi Broadcasting Authority.
              </p>
            </div>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/livestreams.bundle.js"></script>
  </body>
</html>
