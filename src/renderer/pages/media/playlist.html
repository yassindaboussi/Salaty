<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="audioArchive">Audio Playlist - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/playlist.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-navy" id="app">
      <div class="drag-area"></div>

      <div class="playlist-container">
        <!-- Header -->
        <header
          class="page-header playlist-header"
          data-page-header
          data-controls-class="playlist-controls"
          data-back="albums"
        >
          <h1
            class="page-header__title playlist-title"
            data-i18n="audioArchive"
          >
            Audio Archive
          </h1>
        </header>

        <!-- Search Box -->
        <div class="search-container">
          <div class="search-box">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input
              type="text"
              id="searchInput"
              data-i18n-placeholder="searchInPlaylist"
              data-i18n-aria-label="searchInPlaylist"
              class="search-input"
              placeholder="Search in playlist..."
            />
          </div>
        </div>

        <!-- Main Content Area -->
        <main class="content-area">
          <!-- Results List -->
          <div class="results-list" id="resultsList">
            <!-- Results will be injected here -->
          </div>

          <!-- Player Controls -->
          <div class="player-controls">
            <!-- Album Art -->
            <div class="album-art">
              <i class="fas fa-music" aria-hidden="true"></i>
            </div>

            <!-- Track Info -->
            <div class="current-track-display">
              <h4 id="currentTrackTitle">No Track Selected</h4>
              <p id="currentTrackArtist">-</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
              <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div class="time-display">
                <span id="currentTime">0:00</span> /
                <span id="duration">0:00</span>
              </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons">
              <button
                type="button"
                class="skip-btn prev-btn"
                id="prevBtn"
                data-tooltip="tooltipPrev"
              >
                <i class="fas fa-step-backward" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="play-pause-btn"
                id="playPauseBtn"
                data-tooltip="tooltipPlayPause"
              >
                <i class="fas fa-play" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="skip-btn next-btn"
                id="nextBtn"
                data-tooltip="tooltipNext"
              >
                <i class="fas fa-step-forward" aria-hidden="true"></i>
              </button>
            </div>

            <!-- Volume Control -->
            <div class="volume-control">
              <i class="fas fa-volume-up" aria-hidden="true"></i>
              <input
                type="range"
                class="volume-slider"
                id="volumeSlider"
                min="0"
                max="100"
                value="100"
                aria-label="Volume"
                data-i18n-aria-label="volume"
              />
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../../js-bundled/playlist.bundle.js"></script>
  </body>
</html>
