<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="audioArchive">Audio Playlist - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/playlist.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="playlist-container">
        <header
          class="page-header playlist-header"
          data-page-header
          data-controls-class="playlist-controls"
          data-back="albums"
        >
          <h1 class="page-header__title" data-i18n="audioArchive">
            Audio Archive
          </h1>
        </header>

        <main class="pl-layout">
          <!-- What was opened: its tracks -->
          <section class="pl-main" aria-labelledby="plHeading">
            <div class="pl-head">
              <div class="pl-head-text">
                <h2 class="pl-heading" id="plHeading"></h2>
                <p class="pl-subtitle">
                  <span id="plSubtitle"></span>
                  <span class="pl-count" id="plCount"></span>
                </p>
              </div>
            </div>
            <div class="pl-search" role="search">
              <i
                class="fas fa-magnifying-glass pl-search-icon"
                aria-hidden="true"
              ></i>
              <input
                type="search"
                class="pl-search-input"
                id="plSearch"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="searchInPlaylist"
                data-i18n-aria-label="searchInPlaylist"
                placeholder="Search in playlist..."
              />
            </div>
            <div class="pl-list" id="plList"></div>
          </section>

          <!-- The player -->
          <aside
            class="pl-player"
            data-i18n-aria-label="acNowPlaying"
            aria-label="Now playing"
          >
            <div class="pl-art" id="plArt"></div>
            <div class="pl-now" aria-live="polite">
              <p class="pl-title-now" id="plTitle">No Track Selected</p>
              <p class="pl-artist-now" id="plArtist"></p>
            </div>

            <div class="pl-progress">
              <input
                type="range"
                class="pl-range"
                id="plSeek"
                min="0"
                max="1"
                value="0"
                step="1"
                data-i18n-aria-label="acSeek"
                aria-label="Position"
              />
              <div class="pl-times">
                <span id="plTime">0:00</span>
                <span id="plDuration">0:00</span>
              </div>
            </div>

            <div class="pl-controls">
              <button
                type="button"
                class="pl-btn"
                id="plPrev"
                data-tooltip="tooltipPrev"
              >
                <i class="fas fa-backward-step" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="pl-btn pl-play"
                id="plPlay"
                data-tooltip="tooltipPlay"
              >
                <i class="fas fa-play" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="pl-btn"
                id="plNext"
                data-tooltip="tooltipNext"
              >
                <i class="fas fa-forward-step" aria-hidden="true"></i>
              </button>
            </div>

            <div class="pl-volume">
              <i class="fas fa-volume-low" aria-hidden="true"></i>
              <input
                type="range"
                class="pl-range"
                id="plVolume"
                min="0"
                max="100"
                value="100"
                data-i18n-aria-label="volume"
                aria-label="Volume"
              />
              <i class="fas fa-volume-high" aria-hidden="true"></i>
            </div>
          </aside>
        </main>
      </div>
    </div>
    <script src="../../js-bundled/playlist.bundle.js"></script>
  </body>
</html>
