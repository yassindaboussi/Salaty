<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="audioArchive">Audio Albums - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/albums.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-navy" id="app">
      <div class="drag-area"></div>

      <div class="albums-container">
        <!-- Header -->
        <header
          class="page-header albums-header"
          data-page-header
          data-back="features"
        >
          <h1 class="page-header__title albums-title" data-i18n="audioArchive">
            Audio Archive
          </h1>
        </header>

        <!-- Collapsible groups: Quran Recitation (reciters) and Tadabor.
             Both start collapsed; each has its own search + content area
             that only loads data once the user actually expands it. -->
        <main class="archive-groups">
          <!-- Quran Recitation -->
          <div class="archive-group" id="reciteGroup">
            <button
              type="button"
              class="archive-group-header"
              id="reciteGroupHeader"
              aria-expanded="false"
            >
              <span class="archive-group-header-left">
                <i
                  class="fas fa-book-quran archive-group-icon"
                  aria-hidden="true"
                ></i>
                <span
                  class="archive-group-title"
                  id="reciteGroupTitle"
                  data-i18n="quranRecitation"
                  >Quran Recitation</span
                >
              </span>
              <i
                class="fas fa-chevron-down archive-group-chevron"
                aria-hidden="true"
              ></i>
            </button>
            <div class="archive-group-content">
              <div class="search-container">
                <div class="search-box">
                  <i class="fas fa-search" aria-hidden="true"></i>
                  <input
                    type="text"
                    id="searchInput"
                    data-i18n-placeholder="searchReciters"
                    data-i18n-aria-label="searchReciters"
                    class="search-input"
                    placeholder="Search reciters..."
                  />
                </div>
              </div>
              <div class="archive-body">
                <div class="albums-grid" id="albumsGrid">
                  <!-- Reciters will be injected here -->
                </div>
                <div class="az-index" id="azIndex">
                  <!-- A-Z letters injected here -->
                </div>
              </div>
            </div>
          </div>

          <!-- Tafasir -->
          <div class="archive-group" id="tafsirGroup">
            <button
              type="button"
              class="archive-group-header"
              id="tafsirGroupHeader"
              aria-expanded="false"
            >
              <span class="archive-group-header-left">
                <i
                  class="fas fa-book-open archive-group-icon"
                  aria-hidden="true"
                ></i>
                <span
                  class="archive-group-title"
                  id="tafsirGroupTitle"
                  data-i18n="tafasir"
                  >Tafasir</span
                >
              </span>
              <i
                class="fas fa-chevron-down archive-group-chevron"
                aria-hidden="true"
              ></i>
            </button>
            <div class="archive-group-content">
              <div class="search-container">
                <div class="search-box">
                  <i class="fas fa-search" aria-hidden="true"></i>
                  <input
                    type="text"
                    id="tafsirSearchInput"
                    data-i18n-placeholder="searchTafasir"
                    data-i18n-aria-label="searchTafasir"
                    class="search-input"
                    placeholder="Search..."
                  />
                </div>
              </div>
              <button
                type="button"
                class="archive-back-link"
                id="tafsirBackBtn"
                style="display: none"
              >
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                <span id="tafsirBackBtnLabel" data-i18n="tafasirBooks"
                  >Tafsir books</span
                >
              </button>
              <div class="archive-body">
                <div class="albums-grid" id="tafsirGrid">
                  <!-- Tafsir books, then surahs, injected here -->
                </div>
              </div>
            </div>
          </div>

          <!-- Tadabor -->
          <div class="archive-group" id="tadaborGroup">
            <button
              type="button"
              class="archive-group-header"
              id="tadaborGroupHeader"
              aria-expanded="false"
            >
              <span class="archive-group-header-left">
                <i
                  class="fas fa-lightbulb archive-group-icon"
                  aria-hidden="true"
                ></i>
                <span
                  class="archive-group-title"
                  id="tadaborGroupTitle"
                  data-i18n="tadabor"
                  >Tadabor</span
                >
              </span>
              <i
                class="fas fa-chevron-down archive-group-chevron"
                aria-hidden="true"
              ></i>
            </button>
            <div class="archive-group-content">
              <div class="search-container">
                <div class="search-box">
                  <i class="fas fa-search" aria-hidden="true"></i>
                  <input
                    type="text"
                    id="tadaborSearchInput"
                    data-i18n-placeholder="searchSurahs"
                    data-i18n-aria-label="searchSurahs"
                    class="search-input"
                    placeholder="Search surahs..."
                  />
                </div>
              </div>
              <div class="archive-body">
                <div class="albums-grid" id="tadaborGrid">
                  <!-- Surahs with Tadabor content will be injected here -->
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>

      <!-- Recitation-style picker (for reciters with more than one moshaf) -->
      <div class="modal" id="moshafModal">
        <div class="modal-content moshaf-modal-content">
          <div class="moshaf-modal-header">
            <h3 id="moshafModalTitle"></h3>
            <button
              type="button"
              class="moshaf-modal-close"
              id="moshafModalClose"
              aria-label="Close"
              data-i18n-aria-label="close"
            >
              <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <div class="moshaf-modal-list" id="moshafModalList">
            <!-- Moshaf options injected here -->
          </div>
        </div>
      </div>
    </div>
    <script src="../../js-bundled/albums.bundle.js"></script>
  </body>
</html>
