<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Albums - Salaty</title>
    <link
      rel="stylesheet"
      href="../../vendor/fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/albums.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-navy" id="app">
      <div class="drag-area"></div>

      <div class="albums-container">
        <!-- Header -->
        <div class="albums-header">
          <button
            class="back-btn"
            id="backBtn"
            aria-label="Back"
            data-tooltip="tooltipBack"
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <h2 class="albums-title">Audio Archive</h2>

          <div class="albums-controls">
            <button
              class="control-btn minimize-btn"
              id="minimizeBtn"
              aria-label="Minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <!-- Fullscreen button -->
            <button
              class="control-btn fullscreen-btn"
              id="fullscreenBtn"
              aria-label="Toggle Fullscreen"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand"></i>
            </button>

            <button
              class="control-btn close-btn"
              id="closeBtn"
              aria-label="Close"
              data-tooltip="tooltipClose"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Collapsible groups: Quran Recitation (reciters) and Tadabor.
             Both start collapsed; each has its own search + content area
             that only loads data once the user actually expands it. -->
        <div class="archive-groups" id="archiveGroups">
          <!-- Quran Recitation -->
          <div class="archive-group" id="reciteGroup">
            <button
              class="archive-group-header"
              id="reciteGroupHeader"
              aria-expanded="false"
            >
              <span class="archive-group-header-left">
                <i class="fas fa-book-quran archive-group-icon"></i>
                <span class="archive-group-title" id="reciteGroupTitle"
                  >Quran Recitation</span
                >
              </span>
              <i class="fas fa-chevron-down archive-group-chevron"></i>
            </button>
            <div class="archive-group-content" id="reciteGroupContent">
              <div class="search-container">
                <div class="search-box">
                  <i class="fas fa-search"></i>
                  <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search reciters..."
                  />
                </div>
              </div>
              <div class="archive-body">
                <div class="albums-grid" id="albumsGrid">
                  <!-- Reciters will be injected here -->
                </div>
                <div class="az-index" id="azIndex">
                  <!-- A-Z letters injected here -->
                </div>
              </div>
            </div>
          </div>

          <!-- Tafasir -->
          <div class="archive-group" id="tafsirGroup">
            <button
              class="archive-group-header"
              id="tafsirGroupHeader"
              aria-expanded="false"
            >
              <span class="archive-group-header-left">
                <i class="fas fa-book-open archive-group-icon"></i>
                <span class="archive-group-title" id="tafsirGroupTitle"
                  >Tafasir</span
                >
              </span>
              <i class="fas fa-chevron-down archive-group-chevron"></i>
            </button>
            <div class="archive-group-content" id="tafsirGroupContent">
              <div class="search-container">
                <div class="search-box">
                  <i class="fas fa-search"></i>
                  <input
                    type="text"
                    id="tafsirSearchInput"
                    class="search-input"
                    placeholder="Search..."
                  />
                </div>
              </div>
              <button
                class="archive-back-link"
                id="tafsirBackBtn"
                style="display: none"
              >
                <i class="fas fa-arrow-left"></i>
                <span id="tafsirBackBtnLabel">Tafsir books</span>
              </button>
              <div class="archive-body">
                <div class="albums-grid" id="tafsirGrid">
                  <!-- Tafsir books, then surahs, injected here -->
                </div>
              </div>
            </div>
          </div>

          <!-- Tadabor -->
          <div class="archive-group" id="tadaborGroup">
            <button
              class="archive-group-header"
              id="tadaborGroupHeader"
              aria-expanded="false"
            >
              <span class="archive-group-header-left">
                <i class="fas fa-lightbulb archive-group-icon"></i>
                <span class="archive-group-title" id="tadaborGroupTitle"
                  >Tadabor</span
                >
              </span>
              <i class="fas fa-chevron-down archive-group-chevron"></i>
            </button>
            <div class="archive-group-content" id="tadaborGroupContent">
              <div class="search-container">
                <div class="search-box">
                  <i class="fas fa-search"></i>
                  <input
                    type="text"
                    id="tadaborSearchInput"
                    class="search-input"
                    placeholder="Search surahs..."
                  />
                </div>
              </div>
              <div class="archive-body">
                <div class="albums-grid" id="tadaborGrid">
                  <!-- Surahs with Tadabor content will be injected here -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recitation-style picker (for reciters with more than one moshaf) -->
      <div class="modal moshaf-modal" id="moshafModal">
        <div class="modal-content moshaf-modal-content">
          <div class="moshaf-modal-header">
            <h3 id="moshafModalTitle">Reciter</h3>
            <button
              class="moshaf-modal-close"
              id="moshafModalClose"
              aria-label="Close"
            >
              <i class="fas fa-xmark"></i>
            </button>
          </div>
          <div class="moshaf-modal-list" id="moshafModalList">
            <!-- Moshaf options injected here -->
          </div>
        </div>
      </div>
    </div>
    <script src="../../js-bundled/albums.bundle.js"></script>
  </body>
</html>
