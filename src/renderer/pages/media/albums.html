<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="audioArchive">Audio Albums - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/albums.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="albums-container">
        <header
          class="page-header albums-header"
          data-page-header
          data-controls-class="albums-controls"
          data-back="features"
        >
          <h1 class="page-header__title" data-i18n="audioArchive">
            Audio Archive
          </h1>
        </header>

        <main class="ac-main" id="acMain">
          <div class="ac-top">
            <div
              class="ac-tabs"
              id="acTabs"
              role="tablist"
              data-i18n-aria-label="audioArchive"
            >
              <button
                type="button"
                class="ac-tab"
                id="acTabRecite"
                role="tab"
                data-tab="recite"
                aria-controls="acPanelRecite"
                aria-selected="true"
              >
                <i class="fas fa-microphone-lines" aria-hidden="true"></i>
                <span data-i18n="quranRecitation">Quran Recitation</span>
              </button>
              <button
                type="button"
                class="ac-tab"
                id="acTabTafsir"
                role="tab"
                data-tab="tafsir"
                aria-controls="acPanelTafsir"
                aria-selected="false"
                tabindex="-1"
              >
                <i class="fas fa-book-open" aria-hidden="true"></i>
                <span data-i18n="tafasir">Tafasir</span>
              </button>
              <button
                type="button"
                class="ac-tab"
                id="acTabTadabor"
                role="tab"
                data-tab="tadabor"
                aria-controls="acPanelTadabor"
                aria-selected="false"
                tabindex="-1"
              >
                <i class="fas fa-lightbulb" aria-hidden="true"></i>
                <span data-i18n="tadabor">Tadabor</span>
              </button>
            </div>

            <div class="ac-search" role="search">
              <i
                class="fas fa-magnifying-glass ac-search-icon"
                aria-hidden="true"
              ></i>
              <input
                type="search"
                class="ac-search-input"
                id="acSearch"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
          </div>

          <!-- Recitations -->
          <section
            class="ac-panel"
            id="acPanelRecite"
            role="tabpanel"
            aria-labelledby="acTabRecite"
          >
            <div class="ac-filters">
              <div
                class="ac-chips"
                id="acRiwaya"
                role="group"
                data-i18n-aria-label="acRiwaya"
              ></div>
              <label class="ac-complete">
                <span data-i18n="acCompleteOnly">Complete Quran only</span>
                <span class="toggle-switch">
                  <input type="checkbox" role="switch" id="acComplete" />
                  <span class="toggle-slider"></span>
                </span>
              </label>
            </div>
            <div class="ac-list" id="acReciters"></div>
          </section>

          <!-- Tafasir -->
          <section
            class="ac-panel"
            id="acPanelTafsir"
            role="tabpanel"
            aria-labelledby="acTabTafsir"
            hidden
          >
            <div class="ac-list" id="acTafsir"></div>
          </section>

          <!-- Tadabor -->
          <section
            class="ac-panel"
            id="acPanelTadabor"
            role="tabpanel"
            aria-labelledby="acTabTadabor"
            hidden
          >
            <div class="ac-list" id="acTadabor"></div>
          </section>
        </main>
      </div>

      <!-- A reciter's recitations, to pick one -->
      <dialog class="ac-dialog" id="acDialog" aria-labelledby="acDialogHead">
        <div class="ac-dialog-head" id="acDialogHead"></div>
        <button
          type="button"
          class="ac-dialog-close"
          id="acDialogClose"
          data-tooltip="close"
        >
          <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
        <ul class="ac-dialog-list" id="acDialogList"></ul>
      </dialog>
    </div>
    <script src="../../js-bundled/albums.bundle.js"></script>
  </body>
</html>
