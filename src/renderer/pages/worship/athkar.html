<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="athkar">Athkar - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/athkar.css" />
    <link rel="stylesheet" href="../../css/03-components/success-toast.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="athkar-container">
        <header
          class="page-header athkar-header"
          data-page-header
          data-controls-class="athkar-controls"
          data-back="features"
        >
          <h1
            class="page-header__title athkar-title"
            id="athkarTitle"
            data-i18n="athkar"
          >
            Athkar
          </h1>
          <button
            type="button"
            class="control-btn reset-all-btn"
            id="resetAllBtn"
            data-tooltip="tooltipResetAll"
            data-header-control
          >
            <i class="fas fa-redo" aria-hidden="true"></i>
          </button>
        </header>

        <!-- Search -->
        <div class="athkar-search">
          <button
            class="athkar-sidebar-toggle"
            id="sidebarToggleBtn"
            type="button"
            data-tooltip="tooltipCollapseSidebar"
          >
            <i class="fas fa-table-columns" aria-hidden="true"></i>
          </button>
          <div class="athkar-search-field">
            <i
              class="fas fa-magnifying-glass athkar-search-icon"
              aria-hidden="true"
            ></i>
            <input
              type="text"
              id="athkarSearchInput"
              data-i18n-placeholder="searchAthkar"
              data-i18n-aria-label="searchAthkar"
              class="athkar-search-input"
              placeholder="Search for a dhikr or dua..."
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Two-pane body: category sidebar + athkar content -->
        <main class="athkar-body">
          <!-- Category Navigation (grouped, collapsible sidebar) -->
          <div class="category-nav" id="categoryNav">
            <!-- Groups + categories will be dynamically loaded -->
          </div>

          <!-- Athkar Content -->
          <div class="athkar-content">
            <div class="athkar-loading" id="athkarLoading">
              <div class="athkar-loading-content">
                <i
                  class="fas fa-book-open athkar-loading-icon"
                  aria-hidden="true"
                ></i>
                <span class="athkar-loading-dots" aria-hidden="true"
                  ><span></span><span></span><span></span
                ></span>
                <span id="loadingText" data-i18n="loadingAthkar"
                  >Loading Athkar...</span
                >
              </div>
            </div>

            <div class="athkar-list" id="athkarList">
              <!-- Athkar cards will be loaded here -->
            </div>
          </div>
        </main>

        <footer class="athkar-footer">
          <div
            class="athkar-footer-text"
            id="athkarFooterText"
            data-i18n="remembrancesFromSunnah"
          >
            Remembrances from the Sunnah
          </div>
          <div
            class="athkar-footer-text athkar-footer-verified"
            id="athkarFooterVerified"
            data-i18n="hadithVerifiedFooter"
          >
            Hadith references verified against sunnah.com
          </div>
        </footer>
      </div>
    </div>

    <script src="../../js-bundled/athkar.bundle.js"></script>
  </body>
</html>
