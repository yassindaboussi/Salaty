<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://server18.mp3quran.net https://cdn.mp3quran.net; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="athkar">Athkar - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/03-components/custom-dialog.css" />
    <link rel="stylesheet" href="../../css/04-pages/athkar.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="athkar-container">
        <header
          class="page-header athkar-header"
          data-page-header
          data-controls-class="athkar-controls"
          data-back="features"
        >
          <h1 class="page-header__title" id="athkarTitle" data-i18n="athkar">
            Athkar
          </h1>
        </header>

        <main class="ak-layout" id="akLayout">
          <!-- The open category, or the search results -->
          <section class="ak-main" aria-labelledby="akTitle">
            <div class="ak-head">
              <i
                class="fas fa-sun ak-title-icon"
                id="akTitleIcon"
                aria-hidden="true"
              ></i>
              <h2 class="ak-title" id="akTitle"></h2>
              <span class="ak-progress" id="akProgress"></span>
              <button
                type="button"
                class="ak-icon-btn"
                id="akReset"
                data-tooltip="akResetCategory"
              >
                <i class="fas fa-rotate" aria-hidden="true"></i>
              </button>
            </div>
            <div class="ak-bar" id="akBar">
              <span class="ak-bar-fill" id="akBarFill"></span>
            </div>
            <div class="ak-list" id="akList"></div>
            <p class="ak-live" id="akLive" aria-live="polite"></p>
          </section>

          <!-- The search and the categories -->
          <aside class="ak-panel">
            <div class="ak-panel-head">
              <h2 class="ak-panel-heading" data-i18n="akCategories">
                Categories
              </h2>
              <button
                type="button"
                class="ak-panel-toggle"
                id="akPanelToggle"
                aria-controls="akPanelBody"
                aria-expanded="true"
                data-tooltip="akPanelHide"
              >
                <i class="fas fa-angles-right" aria-hidden="true"></i>
              </button>
            </div>

            <!-- folded: a strip of icons (search, then one per category) -->
            <div class="ak-rail" id="akRail"></div>

            <div class="ak-panel-body" id="akPanelBody">
              <div class="ak-search" role="search">
                <i
                  class="fas fa-magnifying-glass ak-search-icon"
                  aria-hidden="true"
                ></i>
                <input
                  type="search"
                  class="ak-search-input"
                  id="akSearch"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-placeholder="searchAthkar"
                  data-i18n-aria-label="searchAthkar"
                  placeholder="Search for a dhikr or dua..."
                />
                <button
                  type="button"
                  class="ak-search-clear"
                  id="akSearchClear"
                  data-tooltip="akClearSearch"
                  hidden
                >
                  <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
              </div>
              <nav
                class="ak-nav"
                id="akNav"
                data-i18n-aria-label="akCategories"
              ></nav>
            </div>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/athkar.bundle.js"></script>
  </body>
</html>
