<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hijri Calendar - Salaty Time</title>
    <link
      rel="stylesheet"
      href="../../vendor/fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/hijri-calendar.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
  </head>

  <body class="page-loading">
    <div class="app-container theme-dark" id="app">
      <div class="drag-area"></div>

      <div class="calendar-container">
        <div class="calendar-header">
          <button
            class="back-btn"
            id="backBtn"
            aria-label="Back"
            data-tooltip="tooltipBack"
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <h2 class="calendar-title" id="calendarTitle">Hijri Calendar</h2>

          <div class="calendar-controls">
            <!-- Minimize button -->
            <button
              class="control-btn minimize-btn"
              id="minimizeBtn"
              aria-label="Minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>

            <!-- Fullscreen button -->
            <button
              class="control-btn fullscreen-btn"
              id="fullscreenBtn"
              aria-label="Toggle Fullscreen"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand"></i>
            </button>

            <!-- Close button -->
            <button
              class="control-btn close-btn"
              id="closeBtn"
              aria-label="Close"
              data-tooltip="tooltipClose"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="calendar-content" id="calendarContent">
          <!-- Month and Year Navigation -->
          <div class="calendar-nav">
            <button
              class="nav-btn"
              id="prevMonthBtn"
              aria-label="Previous Month"
              data-tooltip="tooltipPrevMonth"
            >
              <i class="fas fa-chevron-left"></i>
            </button>
            <div class="calendar-month-year">
              <h3 class="current-month" id="currentMonth">Muharram</h3>
              <p class="current-year" id="currentYear">1446 AH</p>
            </div>
            <button
              class="nav-btn"
              id="nextMonthBtn"
              aria-label="Next Month"
              data-tooltip="tooltipNextMonth"
            >
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>

          <!-- Quick Actions -->
          <div class="calendar-actions">
            <button
              class="action-btn"
              id="todayBtn"
              data-tooltip="tooltipToday"
            >
              <i class="fas fa-calendar-day"></i>
              <span id="todayBtnText">Today</span>
            </button>
          </div>

          <!-- Gregorian Date Display -->
          <div class="gregorian-date-display" id="gregorianDisplay">
            <i class="fas fa-calendar"></i>
            <span id="gregorianDateText">Loading...</span>
          </div>

          <!-- Calendar Grid -->
          <div class="calendar-grid-container">
            <div class="calendar-weekdays" id="calendarWeekdays">
              <div class="weekday">Sun</div>
              <div class="weekday">Mon</div>
              <div class="weekday">Tue</div>
              <div class="weekday">Wed</div>
              <div class="weekday">Thu</div>
              <div class="weekday">Fri</div>
              <div class="weekday">Sat</div>
            </div>
            <div class="calendar-days" id="calendarDays">
              <!-- Days will be generated by JavaScript -->
            </div>
          </div>

          <!-- Islamic Events Section -->
          <div class="islamic-events" id="islamicEvents">
            <h4 class="events-title" id="eventsTitle">
              Important Islamic Dates
            </h4>
            <div class="events-list" id="eventsList">
              <!-- Events will be generated by JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../js-bundled/renderer.bundle.js"></script>
  </body>
</html>
