<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="hijriCalendar">Hijri Calendar - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/hijri-calendar.css" />
  </head>

  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="calendar-container">
        <header
          class="page-header"
          data-page-header
          data-controls-class="calendar-controls"
          data-back="features"
        >
          <h1
            class="page-header__title calendar-title"
            id="calendarTitle"
            data-i18n="hijriCalendar"
          >
            Hijri Calendar
          </h1>
        </header>

        <main class="calendar-content">
          <!-- Month and Year Navigation -->
          <div class="calendar-nav">
            <button
              type="button"
              class="nav-btn"
              id="prevMonthBtn"
              data-tooltip="tooltipPrevMonth"
            >
              <i class="fas fa-chevron-left" aria-hidden="true"></i>
            </button>
            <div class="calendar-month-year">
              <h3 class="current-month" id="currentMonth">Muharram</h3>
              <p class="current-year" id="currentYear">1446 AH</p>
            </div>
            <button
              type="button"
              class="nav-btn"
              id="nextMonthBtn"
              data-tooltip="tooltipNextMonth"
            >
              <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
          </div>

          <!-- Quick Actions -->
          <div class="calendar-actions">
            <button
              type="button"
              class="action-btn"
              id="todayBtn"
              data-tooltip="tooltipToday"
            >
              <i class="fas fa-calendar-day" aria-hidden="true"></i>
              <span id="todayBtnText" data-i18n="today">Today</span>
            </button>
          </div>

          <!-- Gregorian Date Display -->
          <div class="gregorian-date-display" id="gregorianDisplay">
            <i class="fas fa-calendar" aria-hidden="true"></i>
            <span id="gregorianDateText">Loading...</span>
          </div>

          <!-- Calendar Grid -->
          <div class="calendar-grid-container">
            <div class="calendar-weekdays">
              <div class="weekday">Sun</div>
              <div class="weekday">Mon</div>
              <div class="weekday">Tue</div>
              <div class="weekday">Wed</div>
              <div class="weekday">Thu</div>
              <div class="weekday">Fri</div>
              <div class="weekday">Sat</div>
            </div>
            <div class="calendar-days" id="calendarDays">
              <!-- Days will be generated by JavaScript -->
            </div>
          </div>

          <!-- Islamic Events Section -->
          <div class="islamic-events" id="islamicEvents">
            <h4
              class="events-title"
              id="eventsTitle"
              data-i18n="importantIslamicDates"
            >
              Important Islamic Dates
            </h4>
            <div class="events-list" id="eventsList">
              <!-- Events will be generated by JavaScript -->
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/hijri-calendar.bundle.js"></script>
  </body>
</html>
