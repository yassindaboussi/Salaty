<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="hijriCalendar">Hijri Calendar - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/hijri-calendar.css" />
  </head>

  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="calendar-container">
        <header
          class="page-header"
          data-page-header
          data-controls-class="calendar-controls"
          data-back="features"
        >
          <h1
            class="page-header__title calendar-title"
            id="calendarTitle"
            data-i18n="hijriCalendar"
          >
            Hijri Calendar
          </h1>
        </header>

        <main class="hc-layout">
          <!-- The month: title, navigation and the grid of days -->
          <section class="hc-month" aria-labelledby="hcMonthTitle">
            <div class="hc-toolbar">
              <div class="hc-heading">
                <h2 class="hc-title" id="hcMonthTitle" aria-live="polite">
                  <span id="currentMonth"></span>
                  <span class="hc-title-year" id="currentYear"></span>
                </h2>
                <p class="hc-range" id="gregorianRange"></p>
              </div>
              <div class="hc-actions">
                <button type="button" class="hc-today-btn" id="todayBtn">
                  <span data-i18n="today">Today</span>
                </button>
                <button
                  type="button"
                  class="hc-nav-btn"
                  id="prevMonthBtn"
                  data-tooltip="tooltipPrevMonth"
                >
                  <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <button
                  type="button"
                  class="hc-nav-btn"
                  id="nextMonthBtn"
                  data-tooltip="tooltipNextMonth"
                >
                  <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div
              class="hc-grid"
              id="hcGrid"
              role="grid"
              aria-labelledby="hcMonthTitle"
            >
              <div class="hc-weekdays" role="row" id="hcWeekdays"></div>
              <div class="hc-weeks" role="rowgroup" id="calendarDays"></div>
            </div>
          </section>

          <!-- The selected day, and the month's occasions -->
          <aside class="hc-panel">
            <div class="hc-card" id="hcDayCard"></div>

            <section class="hc-occasions" aria-labelledby="hcOccasionsTitle">
              <h3
                class="hc-panel-title"
                id="hcOccasionsTitle"
                data-i18n="calendarThisMonth"
              >
                This month
              </h3>
              <ul class="hc-occasion-list" id="eventsList"></ul>
            </section>

            <p class="hc-note" id="hcNote" hidden>
              <i class="fas fa-circle-info hc-note-icon" aria-hidden="true"></i>
              <span data-i18n="calendarCalculatedNote"
                >Calculated on this computer while offline: it may differ by a
                day from the official announcement.</span
              >
            </p>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/hijri-calendar.bundle.js"></script>
  </body>
</html>
