<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="prayerTimesMonthly">
      Monthly Prayer Times - Salaty Time
    </title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/monthly-prayer-times.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="monthly-container">
        <header
          class="page-header monthly-header"
          data-page-header
          data-back="features"
        >
          <h1
            class="page-header__title"
            id="mptTitle"
            data-i18n="prayerTimesMonthly"
          >
            Monthly Prayer Times
          </h1>
        </header>

        <main class="monthly-content">
          <!-- Month navigator -->
          <div class="monthly-nav">
            <button
              type="button"
              class="monthly-nav-btn"
              id="mptPrevBtn"
              data-tooltip="tooltipPrevMonth"
            >
              <i class="fas fa-chevron-left" aria-hidden="true"></i>
            </button>
            <div class="monthly-nav-label" id="mptMonthLabel">—</div>
            <button
              type="button"
              class="monthly-nav-btn"
              id="mptNextBtn"
              data-tooltip="tooltipNextMonth"
            >
              <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
            <button type="button" class="monthly-today-btn" id="mptTodayBtn">
              <i class="fas fa-calendar-day" aria-hidden="true"></i>
              <span id="mptTodayLabel" data-i18n="today">Today</span>
            </button>
          </div>

          <!-- Today snapshot -->
          <div class="monthly-today-card" id="mptTodayCard">
            <div class="monthly-today-date" id="mptTodayDate">—</div>
            <div class="monthly-today-row" id="mptTodayRow">
              <!-- 5 prayer cells injected via JS -->
            </div>
          </div>

          <!-- Table -->
          <div class="monthly-table-wrap">
            <div class="monthly-loading" id="mptLoading">
              <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
              <span id="mptLoadingText" data-i18n="loadingMonthlyPrayerTimes"
                >Loading prayer times...</span
              >
            </div>
            <table class="monthly-table hidden" id="mptTable">
              <thead>
                <tr id="mptTableHead"></tr>
              </thead>
              <tbody id="mptTableBody"></tbody>
            </table>
          </div>
        </main>

        <footer class="monthly-footer">
          <div
            class="monthly-footer-text"
            id="mptFooterText"
            data-i18n="monthlyPrayerTimesFooter"
          >
            Times are calculated for your saved location and may differ slightly
            from your local mosque.
          </div>
        </footer>
      </div>
    </div>

    <script src="../../js-bundled/monthly-prayer-times.bundle.js"></script>
  </body>
</html>
