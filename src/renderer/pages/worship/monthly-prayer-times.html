<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://server18.mp3quran.net https://cdn.mp3quran.net; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space; media-src 'self' https: blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="prayerTimesMonthly">
      Monthly Prayer Times - Salaty Time
    </title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/monthly-prayer-times.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="monthly-container">
        <header
          class="page-header monthly-header"
          data-page-header
          data-controls-class="monthly-controls"
          data-back="features"
        >
          <h1
            class="page-header__title"
            id="mptTitle"
            data-i18n="prayerTimesMonthly"
          >
            Monthly Prayer Times
          </h1>
        </header>

        <main class="mp-layout" id="mpLayout">
          <!-- The month: navigation, then the timetable -->
          <section class="mp-main">
            <div class="mp-head">
              <div class="mp-nav">
                <button
                  type="button"
                  class="mp-btn"
                  id="mpPrev"
                  data-tooltip="tooltipPrevMonth"
                >
                  <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <div class="mp-month">
                  <h2 class="mp-month-name" id="mpMonth" aria-live="polite">
                    —
                  </h2>
                  <p class="mp-month-hijri" id="mpMonthHijri"></p>
                </div>
                <button
                  type="button"
                  class="mp-btn"
                  id="mpNext"
                  data-tooltip="tooltipNextMonth"
                >
                  <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
              </div>
              <div class="mp-actions">
                <button type="button" class="mp-btn mp-btn-text" id="mpToday">
                  <span data-i18n="today">Today</span>
                </button>
                <button
                  type="button"
                  class="mp-btn"
                  id="mpPdf"
                  data-tooltip="mpExportPdf"
                >
                  <i class="fas fa-file-pdf" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <!-- shown in the PDF only -->
            <div class="mp-print-head" id="mpPrintHead"></div>

            <p class="mp-message" id="mpMessage" role="status"></p>

            <div class="mp-table-wrap" id="mpTableWrap" hidden>
              <table class="mp-table" id="mpTable">
                <thead>
                  <tr id="mpTableHead"></tr>
                </thead>
                <tbody id="mpTableBody"></tbody>
              </table>
            </div>
          </section>

          <!-- The selected day's times and the location -->
          <aside class="mp-panel">
            <div class="mp-panel-head">
              <h2 class="mp-panel-heading" id="mpDayTitle">—</h2>
              <button
                type="button"
                class="mp-panel-toggle"
                id="mpPanelToggle"
                aria-controls="mpPanelBody"
                aria-expanded="true"
                data-tooltip="mpPanelHide"
              >
                <i class="fas fa-angles-right" aria-hidden="true"></i>
              </button>
            </div>

            <!-- folded: a strip of icons -->
            <div class="mp-rail" id="mpRail">
              <button
                type="button"
                class="mp-panel-toggle"
                data-rail="day"
                data-tooltip="mpSelectedDay"
              >
                <i class="fas fa-calendar-day" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="mp-panel-toggle"
                data-rail="pdf"
                data-tooltip="mpExportPdf"
              >
                <i class="fas fa-file-pdf" aria-hidden="true"></i>
              </button>
            </div>

            <div class="mp-panel-body" id="mpPanelBody">
              <p class="mp-day-hijri" id="mpDayHijri"></p>
              <ul class="mp-day-times" id="mpDayTimes"></ul>

              <div class="mp-location">
                <p class="mp-box-title" data-i18n="mpLocation">Location</p>
                <p class="mp-location-name" id="mpLocation" dir="auto">—</p>
                <div class="mp-method" id="mpMethodBox" hidden>
                  <p class="mp-box-title" data-i18n="mpMethod">
                    Calculation method
                  </p>
                  <p class="mp-method-name" id="mpMethod"></p>
                  <p class="mp-method-asr" id="mpAsr"></p>
                </div>
                <p class="mp-note" data-i18n="monthlyPrayerTimesFooter">
                  Times are calculated for your saved location and may differ
                  slightly from your local mosque.
                </p>
              </div>
            </div>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/monthly-prayer-times.bundle.js"></script>
  </body>
</html>
