<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="qiblaFinder">Qibla Finder - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/qibla.css" />
    <link rel="stylesheet" href="../../vendor/leaflet/leaflet.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="qibla-container">
        <header
          class="page-header qibla-header"
          data-page-header
          data-controls-class="qibla-controls"
          data-back="features"
        >
          <h1 class="page-header__title" id="qiblaTitle">Qibla Finder</h1>
        </header>

        <div class="qibla-instruction-bar">
          <i class="fas fa-hand-pointer" aria-hidden="true"></i>
          <span id="instructionText"
            >Vous pouvez déplacer le marqueur pour corriger votre position</span
          >
        </div>

        <main class="qibla-content">
          <div class="location-status">
            <p id="locationText">Detecting location...</p>
          </div>

          <div class="qibla-map" id="qiblaMap"></div>

          <button
            type="button"
            id="zoomLocationBtn"
            class="zoom-btn"
            data-tooltip="tooltipZoomLocation"
          >
            <i class="fas fa-crosshairs" aria-hidden="true"></i>
          </button>

          <div class="qibla-info">
            <h1 id="qiblaDegree">--°</h1>
            <p id="qiblaDirectionLabel">from North Clockwise</p>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/qibla.bundle.js"></script>
  </body>
</html>
