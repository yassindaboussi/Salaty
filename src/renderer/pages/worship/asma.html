<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="asmaAllah">Asma Allah - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/asma.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="asma-container">
        <header
          class="page-header asma-header"
          data-page-header
          data-controls-class="asma-controls"
          data-back="features"
        >
          <h1 class="page-header__title" id="asmaTitle" data-i18n="asmaAllah">
            99 Names of Allah
          </h1>
        </header>

        <!-- Asma Content -->
        <main class="asma-content" id="asmaContent">
          <div class="asma-loading" id="asmaLoading">
            <div class="asma-loading-content">
              <i
                class="fas fa-star-and-crescent fa-spin"
                aria-hidden="true"
              ></i>
              <span id="loadingTextAsma" data-i18n="loadingAsma"
                >Loading Names...</span
              >
            </div>
          </div>

          <div class="asma-list" id="asmaList">
            <!-- Asma cards will be loaded here -->
          </div>
        </main>

        <footer class="asma-footer">
          <div
            class="asma-footer-text"
            id="asmaFooterText"
            data-i18n="beautifulNames"
          >
            The Beautiful Names of Allah
          </div>
        </footer>
      </div>
    </div>

    <script src="../../js-bundled/asma.bundle.js"></script>
  </body>
</html>
