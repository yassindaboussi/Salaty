<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sunnahFastingTitle">Sunnah Fasting - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/fasting.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="fasting-container">
        <header
          class="page-header fasting-header"
          data-page-header
          data-controls-class="fasting-controls"
          data-back="features"
        >
          <h1
            class="page-header__title"
            id="fastingTitle"
            data-i18n="sunnahFastingTitle"
          >
            Sunnah Fasting
          </h1>
        </header>

        <main class="fasting-content">
          <!-- Reminder lead time -->
          <div class="fasting-lead-row">
            <div class="fasting-lead-label">
              <i class="fas fa-bell" aria-hidden="true"></i>
              <span id="vfLeadLabel" data-i18n="remindMe">Remind me</span>
            </div>
            <select
              class="fasting-lead-select"
              id="vfLeadSelect"
              aria-labelledby="vfLeadLabel"
            >
              <option value="1" id="vfLeadOpt1" data-i18n="leadOption1">
                The evening before
              </option>
              <option value="2" id="vfLeadOpt2" data-i18n="leadOption2">
                2 days before
              </option>
              <option value="3" id="vfLeadOpt3" data-i18n="leadOption3">
                3 days before
              </option>
              <option value="7" id="vfLeadOpt7" data-i18n="leadOption7">
                1 week before
              </option>
            </select>
          </div>

          <!-- Next occasion hero card -->
          <div class="fasting-hero hidden" id="vfHero">
            <div
              class="fasting-hero-label"
              id="vfHeroLabel"
              data-i18n="nextFastingDay"
            >
              Next Fasting Day
            </div>
            <div class="fasting-hero-main">
              <div class="fasting-hero-icon" id="vfHeroIcon">
                <i class="fas fa-utensils" aria-hidden="true"></i>
              </div>
              <div class="fasting-hero-info">
                <div class="fasting-hero-title" id="vfHeroTitle">—</div>
                <div class="fasting-hero-date" id="vfHeroDate">—</div>
              </div>
              <div class="fasting-hero-countdown" id="vfHeroCountdown">—</div>
            </div>
            <p class="fasting-hero-desc" id="vfHeroDesc"></p>
            <button class="fasting-toggle-btn" id="vfHeroToggle" type="button">
              <i class="fas fa-bell" aria-hidden="true"></i>
              <span id="vfHeroToggleLabel" data-i18n="remindMe">Remind me</span>
            </button>
          </div>

          <!-- Weekly Sunnah (Monday & Thursday) -->
          <div class="fasting-section">
            <div class="fasting-weekly-card">
              <div class="fasting-weekly-icon">
                <i class="fas fa-calendar-week" aria-hidden="true"></i>
              </div>
              <div class="fasting-weekly-info">
                <div
                  class="fasting-weekly-title"
                  id="vfWeeklyTitle"
                  data-i18n="weeklySunnah"
                >
                  Weekly Sunnah
                </div>
                <div
                  class="fasting-weekly-desc"
                  id="vfWeeklyDesc"
                  data-i18n="weeklyMonThuDesc"
                >
                  Fast every Monday & Thursday
                </div>
              </div>
              <label class="fasting-switch">
                <input
                  aria-label="Weekly Sunnah"
                  data-i18n-aria-label="weeklySunnah"
                  type="checkbox"
                  id="vfWeeklyToggle"
                />
                <span class="fasting-switch-slider"></span>
              </label>
            </div>
          </div>

          <!-- Upcoming occasions list -->
          <div class="fasting-section">
            <h3
              class="fasting-section-title"
              id="vfUpcomingTitle"
              data-i18n="upcomingFastingDays"
            >
              Upcoming Fasting Days
            </h3>
            <div class="fasting-list" id="vfList">
              <div class="fasting-loading">
                <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                <span id="vfLoadingText" data-i18n="loadingFastingDays"
                  >Loading fasting days...</span
                >
              </div>
            </div>
          </div>

          <p
            class="fasting-ramadan-note"
            id="vfRamadanNote"
            data-i18n="ramadanNote"
          >
            Ramadan has its own page — this list is for voluntary fasting only
          </p>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/fasting.bundle.js"></script>
  </body>
</html>
