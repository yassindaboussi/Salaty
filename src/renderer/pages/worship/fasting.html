<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sunnahFasting">Sunnah Fasting - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/fasting.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="fasting-container">
        <header
          class="page-header fasting-header"
          data-page-header
          data-controls-class="fasting-controls"
          data-back="features"
        >
          <h1
            class="page-header__title"
            id="fastingTitle"
            data-i18n="sunnahFasting"
          >
            Sunnah Fasting
          </h1>
        </header>

        <main class="vf-layout is-loading" id="vfLayout">
          <div class="vf-main">
            <!-- The next Sunnah fast -->
            <section class="vf-hero" id="vfHero" aria-live="polite">
              <p class="vf-message" data-i18n="fastLoading">
                Loading fasting days…
              </p>
            </section>

            <section class="vf-card" aria-labelledby="vfNearTitle">
              <h2
                class="vf-card-title"
                id="vfNearTitle"
                data-i18n="fastNearTitle"
              >
                Recent and coming days
              </h2>
              <ul class="vf-list" id="vfNear"></ul>

              <h2
                class="vf-card-title"
                id="vfSeasonsTitle"
                data-i18n="fastSeasonsTitle"
              >
                Coming up
              </h2>
              <ul class="vf-list" id="vfSeasons"></ul>

              <p class="vf-card-note" id="vfCalculated" hidden>
                <i class="fas fa-circle-info" aria-hidden="true"></i>
                <span data-i18n="fastCalculatedNote"
                  >Dates calculated on this computer while offline: they may
                  differ by a day.</span
                >
              </p>
              <p class="vf-card-note">
                <i class="fas fa-moon" aria-hidden="true"></i>
                <span data-i18n="ramadanNote"
                  >Ramadan has its own page — this list is for voluntary fasting
                  only</span
                >
              </p>
            </section>
          </div>

          <!-- Reminders, Ramadan make-up, your fasts, days not to fast -->
          <aside class="vf-panel">
            <section class="vf-box" id="vfReminders"></section>
            <section class="vf-box" id="vfMakeUp" hidden></section>
            <section class="vf-box" id="vfMine" hidden></section>
            <section class="vf-box" id="vfNotToFast"></section>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/fasting.bundle.js"></script>
  </body>
</html>
