<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunnah Fasting - Salaty Time</title>
    <link
      rel="stylesheet"
      href="../../vendor/fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/fasting.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-dark" id="app">
      <div class="drag-area"></div>

      <div class="fasting-container">
        <div class="fasting-header">
          <button
            class="back-btn"
            id="backBtn"
            aria-label="Back to Features"
            data-tooltip="tooltipBack"
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <h2 class="fasting-title" id="fastingTitle">Sunnah Fasting</h2>

          <div class="fasting-controls">
            <button
              class="control-btn minimize-btn"
              id="minimizeBtn"
              aria-label="Minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button
              class="control-btn fullscreen-btn"
              id="fullscreenBtn"
              aria-label="Toggle Fullscreen"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand"></i>
            </button>
            <button
              class="control-btn close-btn"
              id="closeBtn"
              aria-label="Close"
              data-tooltip="tooltipClose"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="fasting-content" id="fastingContent">
          <!-- Reminder lead time -->
          <div class="vf-lead-row">
            <div class="vf-lead-label">
              <i class="fas fa-bell"></i>
              <span id="vfLeadLabel">Remind me</span>
            </div>
            <select class="vf-lead-select" id="vfLeadSelect">
              <option value="1" id="vfLeadOpt1">The evening before</option>
              <option value="2" id="vfLeadOpt2">2 days before</option>
              <option value="3" id="vfLeadOpt3">3 days before</option>
              <option value="7" id="vfLeadOpt7">1 week before</option>
            </select>
          </div>

          <!-- Next occasion hero card -->
          <div class="vf-hero vf-hidden" id="vfHero">
            <div class="vf-hero-label" id="vfHeroLabel">Next Fasting Day</div>
            <div class="vf-hero-main">
              <div class="vf-hero-icon" id="vfHeroIcon">
                <i class="fas fa-utensils"></i>
              </div>
              <div class="vf-hero-info">
                <div class="vf-hero-title" id="vfHeroTitle">—</div>
                <div class="vf-hero-date" id="vfHeroDate">—</div>
              </div>
              <div class="vf-hero-countdown" id="vfHeroCountdown">—</div>
            </div>
            <p class="vf-hero-desc" id="vfHeroDesc"></p>
            <button class="vf-toggle-btn" id="vfHeroToggle" type="button">
              <i class="fas fa-bell"></i>
              <span id="vfHeroToggleLabel">Remind me</span>
            </button>
          </div>

          <!-- Weekly Sunnah (Monday & Thursday) -->
          <div class="vf-section">
            <div class="vf-weekly-card" id="vfWeeklyCard">
              <div class="vf-weekly-icon"><i class="fas fa-calendar-week"></i></div>
              <div class="vf-weekly-info">
                <div class="vf-weekly-title" id="vfWeeklyTitle">Weekly Sunnah</div>
                <div class="vf-weekly-desc" id="vfWeeklyDesc">
                  Fast every Monday & Thursday
                </div>
              </div>
              <label class="vf-switch" aria-label="Toggle weekly reminder">
                <input type="checkbox" id="vfWeeklyToggle" />
                <span class="vf-switch-slider"></span>
              </label>
            </div>
          </div>

          <!-- Upcoming occasions list -->
          <div class="vf-section">
            <h3 class="vf-section-title" id="vfUpcomingTitle">
              Upcoming Fasting Days
            </h3>
            <div class="vf-list" id="vfList">
              <div class="vf-loading" id="vfLoading">
                <i class="fas fa-spinner fa-spin"></i>
                <span id="vfLoadingText">Loading fasting days...</span>
              </div>
            </div>
          </div>

          <p class="vf-ramadan-note" id="vfRamadanNote">
            Ramadan has its own page — this list is for voluntary fasting only
          </p>
        </div>
      </div>
    </div>

    <script src="../../js-bundled/renderer.bundle.js"></script>
  </body>
</html>
