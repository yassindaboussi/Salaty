<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holy Quran - Salaty Time</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/home.css" />
    <link rel="stylesheet" href="../../css/04-pages/quran.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-dark" id="app">
      <div class="drag-area"></div>

      <!-- ═══════════════ VIEW: SURAH LIST ═══════════════ -->
      <div class="quran-container" id="viewSurahList">
        <div class="quran-header">
          <button class="back-btn" id="backBtn" aria-label="Back" data-tooltip="tooltipBack">
            <i class="fas fa-arrow-left"></i>
          </button>
          <h2 class="quran-title" id="quranTitle">القرآن الكريم</h2>
          <div class="quran-controls">
            <button class="control-btn" id="minimizeBtn" aria-label="Minimize" data-tooltip="tooltipMinimize">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 13H5v-2h14v2z"/></svg>
            </button>
            <button class="control-btn fullscreen-btn" id="quranFullscreenBtn" aria-label="Toggle Fullscreen" data-tooltip="tooltipExpand">
              <i class="fas fa-expand"></i>
            </button>
            <button class="control-btn close-btn" id="closeBtn" aria-label="Close" data-tooltip="tooltipClose">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="quran-search-bar">
          <i class="fas fa-search quran-search-icon"></i>
          <input
            type="text"
            id="surahSearchInput"
            class="quran-search-input"
            placeholder="Search surah..."
            autocomplete="off"
          />
        </div>

        <!-- Juz / Surah Tab Toggle -->
        <div class="quran-tabs" id="quranTabs">
          <button class="quran-tab active" data-tab="surah" id="tabSurah">Surah</button>
          <button class="quran-tab" data-tab="juz" id="tabJuz">Juz</button>
        </div>

        <!-- Surah Grid -->
        <div class="quran-content" id="quranSurahContent">
          <div class="quran-loading" id="surahLoading">
            <div class="quran-loading-content">
              <i class="fas fa-book-quran fa-spin"></i>
              <span id="loadingText">Loading...</span>
            </div>
          </div>
          <div class="surah-grid" id="surahGrid"></div>
          <div class="juz-list" id="juzList" style="display:none;"></div>
        </div>

        <div class="quran-footer">
          <div class="quran-footer-text" id="quranFooterText">Read the Holy Quran</div>
        </div>
      </div>

      <!-- ═══════════════ VIEW: SURAH READER ═══════════════ -->
      <div class="quran-container" id="viewSurahReader" style="display:none;">
        <div class="quran-header">
          <button class="back-btn" id="readerBackBtn" aria-label="Back to Surah List" data-tooltip="tooltipBack">
            <i class="fas fa-arrow-left"></i>
          </button>
          <div class="reader-surah-info">
            <h2 class="quran-title" id="readerSurahName"></h2>
            <span class="reader-surah-meta" id="readerSurahMeta"></span>
          </div>
          <div class="quran-controls">
            <button class="control-btn reader-settings-btn" id="readerSettingsBtn" aria-label="Settings" data-tooltip="tooltipSettings">
              <i class="fas fa-sliders-h"></i>
            </button>
            <button class="control-btn" id="readerMinimizeBtn" aria-label="Minimize" data-tooltip="tooltipMinimize">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 13H5v-2h14v2z"/></svg>
            </button>
            <button class="control-btn fullscreen-btn" id="readerFullscreenBtn" aria-label="Toggle Fullscreen" data-tooltip="tooltipExpand">
              <i class="fas fa-expand"></i>
            </button>
            <button class="control-btn close-btn" id="readerCloseBtn" aria-label="Close" data-tooltip="tooltipClose">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <!-- Reader Settings Panel (visible by default; close with the X) -->
        <div class="reader-settings-panel" id="readerSettingsPanel">
          <button class="settings-panel-close" id="settingsPanelCloseBtn" aria-label="Close" data-tooltip="tooltipClose">
            <i class="fas fa-times"></i>
          </button>
          <div class="settings-toolbar">
            <div class="settings-group" id="fontSizeGroup">
              <i class="fas fa-text-height settings-group-icon"></i>
              <div class="font-size-controls">
                <button class="font-btn" id="fontDecBtn" aria-label="Decrease font size" data-tooltip="decreaseFontSize"><i class="fas fa-minus"></i></button>
                <span class="font-size-display" id="fontSizeDisplay">26</span>
                <button class="font-btn" id="fontIncBtn" aria-label="Increase font size" data-tooltip="increaseFontSize"><i class="fas fa-plus"></i></button>
              </div>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-group settings-group-translation">
              <i class="fas fa-language settings-group-icon"></i>
              <select class="settings-select" id="translationSelect" aria-label="Translation">
                <option value="none">None (Arabic only)</option>
                <option value="en.sahih">Sahih International (EN)</option>
                <option value="en.asad">Muhammad Asad (EN)</option>
                <option value="fr.hamidullah">Hamidullah (FR)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Ayah Reader Area -->
        <div class="reader-content" id="readerContent">
          <div class="quran-loading" id="readerLoading">
            <div class="quran-loading-content">
              <i class="fas fa-book-quran fa-spin"></i>
              <span>Loading Surah...</span>
            </div>
          </div>
          <!-- Bismillah -->
          <div class="bismillah-header" id="bismillahHeader" style="display:none;">
            <span class="bismillah-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
          </div>
          <!-- Ayahs will be injected here -->
          <div class="ayah-list" id="ayahList"></div>
        </div>

        <!-- Navigation between surahs -->
        <div class="reader-nav">
          <button class="reader-nav-btn" id="prevSurahBtn">
            <i class="fas fa-chevron-left"></i>
            <span id="prevSurahLabel"></span>
          </button>
          <div class="reader-progress">
            <span class="reader-page-info" id="readerPageInfo"></span>
          </div>
          <button class="reader-nav-btn" id="nextSurahBtn">
            <span id="nextSurahLabel"></span>
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>

    </div>

    <script src="../../js/core/renderer.js"></script>
  </body>
</html>
