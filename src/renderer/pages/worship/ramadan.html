<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="ramadhan">Ramadhan - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/ramadan.css" />
  </head>

  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="ramadan-container">
        <header
          class="page-header ramadan-header"
          data-page-header
          data-controls-class="ramadan-controls"
          data-back="features"
        >
          <h1 class="page-header__title ramadan-title" data-i18n="ramadhan">
            Ramadhan
          </h1>
        </header>

        <main class="rm-layout is-empty" id="rmLayout">
          <div class="rm-main">
            <!-- Days until Ramadan, or the live iftar / suhoor countdown -->
            <section class="rm-hero" id="rmHero"></section>

            <section class="rm-card">
              <div class="rm-tabs" role="tablist">
                <button
                  type="button"
                  role="tab"
                  class="rm-tab"
                  id="rmTabTracker"
                  data-tab="tracker"
                  aria-controls="rmPanelTracker"
                  aria-selected="true"
                >
                  <span data-i18n="fastingTracker">Fasting Tracker</span>
                </button>
                <button
                  type="button"
                  role="tab"
                  class="rm-tab"
                  id="rmTabTable"
                  data-tab="table"
                  aria-controls="rmPanelTable"
                  aria-selected="false"
                  tabindex="-1"
                >
                  <span data-i18n="common:timetable">Timetable</span>
                </button>
              </div>

              <div
                class="rm-tabpanel"
                id="rmPanelTracker"
                role="tabpanel"
                aria-labelledby="rmTabTracker"
              >
                <div
                  class="rm-grid"
                  id="rmGrid"
                  role="grid"
                  aria-labelledby="rmTabTracker"
                ></div>
                <ul class="rm-legend">
                  <li>
                    <span class="rm-legend-mark" aria-hidden="true"
                      ><i class="fas fa-check"></i
                    ></span>
                    <span data-i18n="ramadanFasted">Fasted</span>
                  </li>
                  <li>
                    <span class="rm-legend-mark is-missed" aria-hidden="true"
                      ><i class="fas fa-rotate-left"></i
                    ></span>
                    <span data-i18n="ramadanLegendMissed"
                      >Missed (to make up)</span
                    >
                  </li>
                  <li>
                    <i
                      class="fas fa-moon rm-legend-night"
                      aria-hidden="true"
                    ></i>
                    <span data-i18n="ramadanLegendOddNights"
                      >Odd nights of the last ten</span
                    >
                  </li>
                </ul>
              </div>

              <div
                class="rm-tabpanel"
                id="rmPanelTable"
                role="tabpanel"
                aria-labelledby="rmTabTable"
                hidden
              >
                <div class="rm-table-wrap">
                  <table class="rm-table">
                    <thead>
                      <tr>
                        <th scope="col" data-i18n="common:day">Day</th>
                        <th scope="col" data-i18n="common:date">Date</th>
                        <th scope="col" data-i18n="ramadanImsak">Imsak</th>
                        <th scope="col" data-i18n="ramadanSuhoorEnds">
                          Suhoor ends
                        </th>
                        <th scope="col" data-i18n="iftar">Iftar</th>
                        <th scope="col" data-i18n="ramadanFastLength">
                          Fast length
                        </th>
                      </tr>
                    </thead>
                    <tbody id="rmTableBody"></tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>

          <!-- The selected day, the summary, the fasts to make up, Eid -->
          <aside class="rm-panel" id="rmPanel">
            <section class="rm-box" id="rmDayCard"></section>
            <section class="rm-box" id="rmSummary" hidden></section>
            <section class="rm-box" id="rmMakeUp" hidden></section>
            <section class="rm-box" id="rmEid" hidden></section>
          </aside>
        </main>
      </div>
    </div>

    <script src="../../js-bundled/ramadan.bundle.js"></script>
  </body>
</html>
