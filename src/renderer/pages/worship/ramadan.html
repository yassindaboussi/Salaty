<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="ramadhan">Ramadhan - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/ramadan.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="ramadan-container">
        <header
          class="page-header ramadan-header"
          data-page-header
          data-controls-class="ramadan-controls"
          data-back="features"
        >
          <h1 class="page-header__title ramadan-title" data-i18n="ramadhan">
            Ramadhan
          </h1>
        </header>

        <main class="ramadan-content">
          <!-- Today's Overview -->
          <div class="fasting-card" id="todayCard">
            <h3 id="todayFastingTitle" data-i18n="todayFasting">
              Today's Fasting
            </h3>
            <div>
              <div class="ramadan-today-times">
                <div>
                  <i
                    class="fas fa-moon ramadan-today-icon ramadan-today--suhoor"
                    aria-hidden="true"
                  ></i>
                  <div
                    class="ramadan-today-label"
                    id="labelTodaySuhoor"
                    data-i18n="suhoor"
                  >
                    Suhoor
                  </div>
                  <div
                    class="ramadan-today-time ramadan-today--suhoor"
                    id="todaySuhoor"
                  >
                    --:--
                  </div>
                </div>
                <div class="ramadan-today-divider"></div>
                <div>
                  <i
                    class="fas fa-sun ramadan-today-icon ramadan-today--iftar"
                    aria-hidden="true"
                  ></i>
                  <div
                    class="ramadan-today-label"
                    id="labelTodayIftar"
                    data-i18n="iftar"
                  >
                    Iftar
                  </div>
                  <div
                    class="ramadan-today-time ramadan-today--iftar"
                    id="todayIftar"
                  >
                    --:--
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="fasting-card">
            <!-- Tabs header -->
            <div class="ramadan-tabs">
              <button
                type="button"
                class="ramadan-tab active"
                data-tab="tracker"
              >
                <span id="trackerTitle" data-i18n="fastingTracker"
                  >Fasting Tracker</span
                >
              </button>
              <button type="button" class="ramadan-tab" data-tab="table">
                <span id="tableTitle" data-i18n="common:timetable"
                  >Timetable</span
                >
              </button>
            </div>

            <div class="tab-content" id="contentTracker">
              <div class="tracker-grid" id="trackerGrid">
                <!-- Days will be injected here via JS -->
                <div class="day-tracker">
                  <span class="hijri-day">1</span>
                  <span class="gregorian-date">...</span>
                </div>
              </div>
            </div>

            <div class="tab-content" id="contentTable" style="display: none">
              <div class="table-responsive">
                <table class="ramadan-table" id="ramadanTable">
                  <thead>
                    <tr>
                      <th id="thDay" data-i18n="common:day">Day</th>
                      <th id="thDate" data-i18n="common:date">Date</th>
                      <th id="thSuhoor" data-i18n="suhoor">Suhoor</th>
                      <th id="thIftar" data-i18n="iftar">Iftar</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Rows injected via JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>

      <!-- Modal for Daily Times -->
      <div id="dayModal" class="cal-modal">
        <div class="cal-modal-content">
          <span class="cal-modal-close" id="modalClose">&times;</span>
          <div class="cal-modal-title" id="modalTitle"></div>

          <div class="prayer-time-row">
            <div class="prayer-time-label" id="modalLabelSuhoor">
              <i class="fas fa-utensils" aria-hidden="true"></i> Suhoor (Fajr)
            </div>
            <div class="prayer-time-value" id="modalSuhoor">--:--</div>
          </div>

          <div class="prayer-time-row">
            <div class="prayer-time-label" id="modalLabelIftar">
              <i class="fas fa-glass-water" aria-hidden="true"></i> Iftar
              (Maghrib)
            </div>
            <div class="prayer-time-value" id="modalIftar">--:--</div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../js-bundled/ramadan.bundle.js"></script>
  </body>
</html>
