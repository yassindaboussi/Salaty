<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com https://api.alquran.cloud https://mp3quran.net https://www.mp3quran.net https://countriesnow.space https://photon.komoot.io https://ipapi.co; media-src 'self' https: blob:; frame-src https://makkahlive.netlify.app; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="tasbih">Tasbih - Salaty Time</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/tasbih.css" />
    <link rel="stylesheet" href="../../css/03-components/success-toast.css" />
  </head>
  <body class="page-loading">
    <div class="app-container" id="app">
      <div class="drag-area"></div>

      <div class="tasbih-container">
        <header
          class="page-header tasbih-header"
          data-page-header
          data-controls-class="tasbih-controls"
          data-back="features"
        >
          <h1 class="page-header__title" id="tasbihTitle" data-i18n="tasbih">
            Tasbih
          </h1>
        </header>

        <main class="tasbih-content">
          <!-- Active dhikr name + meaning -->
          <div class="tasbih-active-dhikr">
            <div class="tasbih-active-name" id="activeDhikrName">
              سُبْحَانَ اللَّهِ
            </div>
            <div class="tasbih-active-meaning" id="activeDhikrMeaning">
              Glory be to Allah
            </div>
            <div class="tasbih-active-source" id="activeDhikrSource"></div>
          </div>

          <!-- Ring counter, flanked left/right by actions — same pattern as
               a dial-timer screen: dial in the middle, a secondary action
               to one side, the primary action to the other. -->
          <div class="tasbih-ring-row">
            <div class="tasbih-side tasbih-side-left">
              <button
                type="button"
                class="tasbih-side-btn tasbih-side-btn--secondary"
                id="resetBtn"
                data-tooltip="tooltipReset"
              >
                <i class="fas fa-broom" aria-hidden="true"></i>
                <span id="resetLabel" data-i18n="resetBtn">Reset</span>
              </button>
              <button
                type="button"
                class="tasbih-icon-btn"
                id="undoBtn"
                data-tooltip="tooltipUndo"
              >
                <i class="fas fa-rotate-left" aria-hidden="true"></i>
              </button>
            </div>

            <div class="tasbih-ring-wrap">
              <svg
                class="tasbih-ring-svg"
                viewBox="0 0 220 220"
                aria-hidden="true"
              >
                <circle class="tasbih-ring-track" cx="110" cy="110" r="96" />
                <circle
                  class="tasbih-ring-progress"
                  id="tbRingProgress"
                  cx="110"
                  cy="110"
                  r="96"
                />
                <circle
                  class="tasbih-ring-bead"
                  id="tbRingBead"
                  cx="110"
                  cy="14"
                  r="6"
                />
              </svg>
              <button
                type="button"
                class="tasbih-ring-tap"
                id="tbRingTap"
                data-tooltip="tooltipCount"
              >
                <span
                  class="tasbih-round-badge hidden"
                  id="tbRoundBadge"
                ></span>
                <span class="tasbih-count-value" id="counterValue">0</span>
                <span class="tasbih-count-target" id="targetLine">/ 33</span>
              </button>
            </div>

            <div class="tasbih-side tasbih-side-right">
              <button
                type="button"
                class="tasbih-side-btn tasbih-side-btn--primary"
                id="incrementBtn"
                data-tooltip="tooltipCount"
              >
                <i class="fas fa-plus" aria-hidden="true"></i>
                <span id="incrementLabel" data-i18n="countBtn">Count</span>
              </button>
              <button
                type="button"
                class="tasbih-limit-chip"
                id="tbLimitChip"
                aria-pressed="false"
              >
                <i class="fas fa-flag-checkered" aria-hidden="true"></i>
                <span class="tasbih-limit-chip-text" id="tbLimitChipText"
                  >Stop at 33</span
                >
              </button>
              <div class="spacebar-indicator">
                <i class="fas fa-keyboard" aria-hidden="true"></i><kbd>␣</kbd
                ><span id="spacebarText" data-i18n="spacebarHint">Space</span>
              </div>
            </div>
          </div>

          <!-- Dhikr Selection -->
          <div class="tasbih-dhikr-section">
            <div class="section-label" id="dhikrLabel" data-i18n="selectDhikr">
              Select Dhikr
            </div>
            <div class="dhikr-grid" id="dhikrGrid">
              <!-- Dhikr cards injected via JS -->
            </div>
          </div>
        </main>

        <footer class="tasbih-footer">
          <div class="tasbih-footer-text" id="tasbihFooterText">
            "So remember Me; I will remember you" [Quran 2:152]
          </div>
        </footer>
      </div>
    </div>

    <script src="../../js-bundled/tasbih.bundle.js"></script>
  </body>
</html>
