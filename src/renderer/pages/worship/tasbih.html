<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasbih - Salaty Time</title>
    <link
      rel="stylesheet"
      href="../../vendor/fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/04-pages/tasbih.css" />
    <link rel="stylesheet" href="../../css/03-components/adhan-player.css" />
  </head>
  <body class="page-loading">
    <div class="app-container theme-dark" id="app">
      <div class="drag-area"></div>

      <div class="tasbih-container">
        <div class="tasbih-header">
          <button
            class="back-btn"
            id="backBtn"
            aria-label="Back to Features"
            data-tooltip="tooltipBack"
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <h2 class="tasbih-title" id="tasbihTitle">Tasbih</h2>

          <div class="tasbih-controls">
            <button
              class="control-btn minimize-btn"
              id="minimizeBtn"
              aria-label="Minimize"
              data-tooltip="tooltipMinimize"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button
              class="control-btn fullscreen-btn"
              id="fullscreenBtn"
              aria-label="Toggle Fullscreen"
              data-tooltip="tooltipExpand"
            >
              <i class="fas fa-expand"></i>
            </button>
            <button
              class="control-btn close-btn"
              id="closeBtn"
              aria-label="Close"
              data-tooltip="tooltipClose"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="tasbih-content" id="tasbihContent">
          <!-- Active dhikr name + meaning -->
          <div class="tb-active-dhikr">
            <div class="tb-active-name" id="activeDhikrName">سُبْحَانَ اللَّهِ</div>
            <div class="tb-active-meaning" id="activeDhikrMeaning">
              Glory be to Allah
            </div>
          </div>

          <!-- Ring counter, flanked left/right by actions — same pattern as
               a dial-timer screen: dial in the middle, a secondary action
               to one side, the primary action to the other. -->
          <div class="tb-ring-row">
            <div class="tb-side tb-side-left">
              <button
                type="button"
                class="tb-side-btn tb-side-btn--secondary"
                id="resetBtn"
                data-tooltip="tooltipReset"
              >
                <i class="fas fa-broom"></i>
                <span id="resetLabel">Reset</span>
              </button>
              <button
                type="button"
                class="tb-icon-btn"
                id="undoBtn"
                aria-label="Undo"
                data-tooltip="tooltipUndo"
              >
                <i class="fas fa-rotate-left"></i>
              </button>
            </div>

            <div class="tb-ring-wrap">
              <svg class="tb-ring-svg" viewBox="0 0 220 220">
                <circle class="tb-ring-track" cx="110" cy="110" r="96" />
                <circle
                  class="tb-ring-progress"
                  id="tbRingProgress"
                  cx="110"
                  cy="110"
                  r="96"
                />
                <circle class="tb-ring-bead" id="tbRingBead" cx="110" cy="14" r="6" />
              </svg>
              <button
                type="button"
                class="tb-ring-tap"
                id="tbRingTap"
                aria-label="Count"
                data-tooltip="tooltipCount"
              >
                <span class="tb-round-badge tb-hidden" id="tbRoundBadge"></span>
                <span class="tb-count-value" id="counterValue">0</span>
                <span class="tb-count-target" id="targetLine">/ 33</span>
              </button>
            </div>

            <div class="tb-side tb-side-right">
              <button
                type="button"
                class="tb-side-btn tb-side-btn--primary"
                id="incrementBtn"
                data-tooltip="tooltipCount"
              >
                <i class="fas fa-plus"></i>
                <span id="incrementLabel">Count</span>
              </button>
              <button
                type="button"
                class="tb-limit-chip"
                id="tbLimitChip"
                aria-pressed="false"
              >
                <i class="fas fa-flag-checkered"></i>
                <span class="tb-limit-chip-text" id="tbLimitChipText">Stop at 33</span>
              </button>
              <div class="spacebar-indicator">
                <i class="fas fa-keyboard"></i><kbd>␣</kbd><span id="spacebarText">Space</span>
              </div>
            </div>
          </div>

          <!-- Dhikr Selection -->
          <div class="tasbih-dhikr-section">
            <div class="section-label" id="dhikrLabel">Select Dhikr</div>
            <div class="dhikr-grid" id="dhikrGrid">
              <!-- Dhikr cards injected via JS -->
            </div>
          </div>
        </div>

        <div class="tasbih-footer">
          <div class="tasbih-footer-text" id="tasbihFooterText">
            "So remember Me; I will remember you" [Quran 2:152]
          </div>
        </div>
      </div>
    </div>

    <script src="../../js-bundled/renderer.bundle.js"></script>
  </body>
</html>
